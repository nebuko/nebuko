# Generated by `nebuko init`. Re-running init asks before overwriting it.
name: Nebuko

on:
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association) ||
        github.event.comment.user.login == 'nebuko[bot]'
      )
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@${pin_ref}
    with:
      agent_config_path: "${agent_config_path}"
      runs_on: "${runs_on}"
    secrets:
${secrets_block}
