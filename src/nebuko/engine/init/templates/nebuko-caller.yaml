# Generated by `nebuko init`. Re-running init asks before overwriting it.
name: Nebuko

on:
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    # Cheap caller-side pre-filter: only trusted authors (OWNER, MEMBER,
    # COLLABORATOR) may start a run, and the app's own comments never re-trigger
    # it. Full CALLER_AUTH enforcement happens inside the reusable workflow.
    if: >-
      (github.event_name != 'issues' ||
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) &&
      (github.event_name != 'issue_comment' ||
        (!endsWith(github.event.comment.user.login, '[bot]') &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@${pin_ref}
    with:
      agent_config_path: "${agent_config_path}"
      runs_on: "${runs_on}"
    secrets:
${secrets_block}
