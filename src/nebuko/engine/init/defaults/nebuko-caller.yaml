# Generated by `nebuko init`. Re-running init asks before overwriting it.
name: Nebuko

on:
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  agent:
    # A human /nebuko comment carrying --personal belongs to the broker's personal lane
    # (ADR-0017, #1479); starting a project run for it would duplicate the run. Bot
    # comments (reports, continuations) are never personal dispatches, so they always
    # pass. The engine's parse_trigger stays authoritative (first command line only).
    # Trade-off: GitHub expressions cannot inspect the first line, so a flagless
    # /nebuko comment that mentions --personal on a later line is skipped here even
    # though the engine would run it. Such a comment needs its own line break or
    # rewording (ADR-0017).
    if: >-
      github.event_name != 'issue_comment' ||
      (
        (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                   github.event.comment.author_association) ||
          github.event.comment.user.login == 'nebuko[bot]'
        ) &&
        (
          github.event.comment.user.login == 'nebuko[bot]' ||
          !startsWith(github.event.comment.body, '/nebuko') ||
          !contains(github.event.comment.body, '--personal')
        )
      )
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@${pin_ref}
    with:
      agent_config_path: "${agent_config_path}"
      runs_on: "${runs_on}"
    secrets:
${secrets_block}
