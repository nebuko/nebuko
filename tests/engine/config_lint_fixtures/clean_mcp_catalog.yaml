providers:
  p1:
    api_url: "http://example.test/v1"
    api_token_env: "P1_TOKEN"
llms:
  l1:
    model_path: "hosted_vllm/l1"
    provider: "${providers.p1}"
mcp_servers:
  brave-search:
    name: "brave-search"
    command: "npx"
    args:
      - "-y"
      - "@brave/brave-search-mcp-server@2.1.4"
      - "--enabled-tools"
      - "brave_web_search"
      - "brave_news_search"
    env:
      BRAVE_API_KEY: "BRAVE_API_KEY"
agents:
  a:
    model: "${llms.l1}"
    temperature: 0.1
    role: "Test agent role."
    prompt_file: ".agents/prompts/a.md"
    skills: ["skill-a"]
    tools: ["think", "finalize"]
    mcp_servers:
      - "${mcp_servers.brave-search}"
