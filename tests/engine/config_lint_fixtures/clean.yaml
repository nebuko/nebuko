providers:
  p1:
    api_url: "http://example.test/v1"
    api_token_env: "P1_TOKEN"
llms:
  l1:
    model_path: "hosted_vllm/l1"
    provider: "${providers.p1}"
agents:
  a:
    model: "${llms.l1}"
    temperature: 0.1
    role: "Test agent role."
    prompt_file: ".agents/prompts/a.md"
    skills: ["skill-a"]
    tools: ["think", "finish"]
    mcp_servers:
      - name: "brave-search"
        command: "npx"
        args: ["-y", "@brave/brave-search-mcp-server@2.0.1"]
        env:
          BRAVE_API_KEY: "BRAVE_API_KEY"
