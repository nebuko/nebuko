providers:
  p1:
    api_url: "http://example.test/v1"
    api_token_env: "P1_TOKEN"
llms:
  l1:
    model_path: "hosted_vllm/l1"
    provider: "${providers.p1}"
mcp_servers:
  used-server:
    name: "used-server"
    command: "npx"
  dead-server:
    name: "dead-server"
    command: "npx"
agents:
  a:
    model: "${llms.l1}"
    prompt_file: ".agents/prompts/a.md"
    skills: ["skill-a"]
    mcp_servers:
      - "${mcp_servers.used-server}"
