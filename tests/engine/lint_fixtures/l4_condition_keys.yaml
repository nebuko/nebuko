name: l4-condition-keys
description: "L4: 'gate' declares on_result 'approved' twice; the second is dead"
steps:
  - name: gate
    agent: architect
    next: done
    conditions:
      - on_result: approved
        next: done
      - on_result: approved
        next: done
  - name: done
    agent: dev
    next: null
