# ── Providers: API endpoints + auth ──
providers:
  commandcode:
    api_url: "https://api.commandcode.ai/provider/v1"
    api_token_env: "COMMANDCODE_API_KEY"

# ── LLMs: model paths referencing providers ──
llms:
  deepseek-v4_1-flash:
    model_path: "openai/deepseek/deepseek-v4.1-flash"
    provider: "${providers.commandcode}"
  glm-5_3-flash:
    model_path: "openai/z-ai/glm-5.3-flash"
    provider: "${providers.commandcode}"
  mimo-2_6-pro:
    model_path: "openai/xiaomi/mimo-v2.6-pro"
    provider: "${providers.commandcode}"
    thinking_enabled: true
    preserve_thinking: true
  
# ── Agents: role → model + prompt + skills + tools ──
# Tools: terminal, file_editor, task_tracker (SDK tools)
#        think, finish (built-in defaults)
agents:
  architect:
    model: "${llms.mimo-2_6-pro}"
    role: "Principal software engineer — analysis, architecture, planning, and delegation; never writes code."
    temperature: 0.4
    prompt_file: "defaults/prompts/architect.md"
    skills: ["call-agent", "posting-contract", "planning"]
    tools: ["think", "finish", "dispatch_next"]
    complexity_overrides:
      low:
        model: "${llms.deepseek-v4_1-flash}"
      high:
        temperature: 0.6
        reasoning: "high"

  dev:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Implementation engineer — writes code, runs tests, manages branches, commits, and PRs."
    temperature: 0.1
    prompt_file: "defaults/prompts/dev.md"
    skills: ["posting-contract", "git-pr-workflow"]
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish", "dispatch_next", "report_scaffold_branch"]

  context:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Read-only context collector — gathers and compiles codebase facts for other agents."
    temperature: 0.1
    prompt_file: "defaults/prompts/context.md"
    skills: ["call-agent", "posting-contract", "context-research"]
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish", "dispatch_next"]
    mcp_servers:
      - name: "brave-search"
        command: "npx"
        args:
          - "-y"
          - "@brave/brave-search-mcp-server@2.1.4"
          - "--enabled-tools"
          - "brave_web_search"
          - "brave_news_search"
        env:
          BRAVE_API_KEY: "BRAVE_API_KEY"

  review:
    model: "${llms.glm-5_3-flash}"
    role: "Code and plan reviewer — reviews PRs and plans round by round and runs retrospectives; never modifies code."
    temperature: 0.4
    prompt_file: "defaults/prompts/review.md"
    skills: ["posting-contract", "plan-review", "retrospective"]
    tools: ["think", "finish", "dispatch_next", "terminal"]

  po:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Product owner — triages and refines issues into actionable specs; never modifies code."
    prompt_file: "defaults/prompts/po.md"
    skills: ["call-agent", "posting-contract", "issue-refinement"]
    tools: ["think", "finish", "dispatch_next"]
