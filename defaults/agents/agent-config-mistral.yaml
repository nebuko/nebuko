# ── Providers: API endpoints + auth ──
# Mistral's API is OpenAI-compatible; the model identifier is the bare model
# name it publishes (https://docs.mistral.ai/inference/pricing).
providers:
  mistral:
    api_url: "https://api.mistral.ai/v1"
    api_token_env: "MISTRAL_API_KEY"
    # Mistral prompt caching: the cache key is a JSON body field whose value is
    # the engine-stamped issue id (LLM_SESSION_ID) at runtime (issue #1068).
    cache_key_param: "prompt_cache_key"

# ── LLMs: model paths referencing providers ──
llms:
  mistral-small-4:
    model_path: "mistral/mistral-small-2603"
    provider: "${providers.mistral}"
    # Per-1M USD prices (https://docs.mistral.ai/inference/pricing): the
    # OpenRouter table cannot match every routed path, so the config pins the
    # tiers and report-time pricing never falls back to $0 (issue #1144).
    input_price: 0.15
    output_price: 0.6
    cache_read_price: 0.015
    reasoning_effort: "none"
  mistral-large-4:
    model_path: "mistral/mistral-large-4"
    provider: "${providers.mistral}"
    # Table id is mistralai/mistral-large-4-0: the path alone does not resolve.
    input_price: 1.36
    output_price: 4.18
    cache_read_price: 0.14
  glm-5_3:
    model_path: "mistral/zai-glm-5-3"
    provider: "${providers.mistral}"
    # Table id is z-ai/glm-5.3: the path alone does not resolve.
    # Prices pinned from https://docs.mistral.ai/inference/pricing (USD /M).
    input_price: 1.4
    output_price: 4.4
    cache_read_price: 0.14

# ── Agents: role → model + prompt + skills + tools ──
# Tools: terminal, terminal_batch, read, edit, write, task_tracker (SDK tools)
#        think, finish (built-in defaults)
agents:
  architect:
    model: "${llms.mistral-large-4}"
    role: "Principal software engineer — analysis, architecture, planning, and delegation; never writes code."
    temperature: 0.4
    prompt_file: "defaults/prompts/architect.md"
    skills:
      - inject: ["call-agent", "planning"]
      - discover: ["complexity", "posting-contract"]
    tools: ["think", "finish", "finalize", "complexity_review", "fetch_comment_bodies"]
    complexity_overrides:
      low:
        model: "${llms.mistral-small-4}"
        reasoning_effort: "medium"
      high:
        model: "${llms.mistral-large-4}"
        temperature: 0.6
        reasoning_effort: "high"

  dev:
    model: "${llms.mistral-small-4}"
    role: "Implementation engineer — writes code, runs tests, manages branches, commits, and PRs."
    temperature: 0.1
    reasoning_effort: "none"
    prompt_file: "defaults/prompts/dev.md"
    skills:
      - discover: ["complexity", "posting-contract"]
    tools: ["terminal", "terminal_batch", "read", "edit", "write", "task_tracker", "think", "finish", "finalize", "report_scaffold_branch", "complexity_review"]

  context:
    model: "${llms.mistral-small-4}"
    role: "Read-only context collector — gathers and compiles codebase facts for other agents."
    temperature: 0.1
    reasoning_effort: "none"
    prompt_file: "defaults/prompts/context.md"
    skills:
      - inject: ["call-agent", "context-research"]
      - discover: ["complexity", "posting-contract"]
    tools: ["terminal", "terminal_batch", "read", "edit", "write", "task_tracker", "think", "finish", "finalize", "complexity_review", "fetch_comment_bodies"]

  review:
    model: "${llms.glm-5_3}"
    role: "Code and plan reviewer — reviews PRs and plans round by round and runs retrospectives; never modifies code."
    temperature: 0.4
    reasoning_effort: "none"
    prompt_file: "defaults/prompts/review.md"
    skills:
      - inject: ["plan-review"]
      - discover: ["retrospective", "complexity", "posting-contract"]
    tools: ["terminal", "terminal_batch", "think", "finish", "finalize", "complexity_review", "fetch_comment_bodies"]

  po:
    model: "${llms.mistral-small-4}"
    role: "Product owner — triages and refines issues into actionable specs; never modifies code."
    prompt_file: "defaults/prompts/po.md"
    skills:
      - inject: ["call-agent", "issue-refinement"]
      - discover: ["complexity", "posting-contract"]
    tools: ["think", "finish", "finalize", "complexity_review", "fetch_comment_bodies"]
