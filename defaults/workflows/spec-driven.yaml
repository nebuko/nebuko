# Spec-Driven Development Workflow
# po → [human spec approval] → architect (architect) → dev (stub) → review → [human stub approval] → dev (implement)

name: spec-driven
description: "Spec-driven development: spec → stub → implement"

steps:
  - name: spec
    agent: po
    human_gate: true
    conditions:
      - on_result: approved
        next: stub_and_implement
      - on_result: rejected
        next: spec

  - name: stub_and_implement
    workflow: spec-driven-impl

