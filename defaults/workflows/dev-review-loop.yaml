# Dev-Review Loop Workflow
# Reusable sub-workflow: execute a single plan step with review; loops on rejection.
# Intended to be referenced per-step from a dynamically generated tmp_impl/workflow.yaml
# (branch-mounted plan orchestration, issue #462).

name: dev-review-loop
description: "Execute a single plan step with review; loops on rejection"

steps:
  - name: implement
    agent: dev
    next: review

  - name: review
    agent: review
    prompt: |
      Engine facts first: if the previous step's context carries an
      `engine_failure` entry, a missing diff or missing commits are an ENGINE
      failure (the run crashed after publishing; the branch was never pushed),
      not agent fabrication — report it as such and do not route it to `plan`;
      ask for the step to be re-run instead.
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
