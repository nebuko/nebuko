name: spec-driven-impl
description: "Spec-driven development: plan -> stub -> implement"

trigger:
  agents: [genius]  # which @@mentions can start this workflow

steps:
  - name: analyze
    agent: genius
    next: context

  - name: context
    agent: ctx
    next: plan

  - name: plan
    agent: genius
    next: stub
    conditions:
      - on_result: approved
        next: stub
      - on_result: rejected
        next: context

  - name: stub
    agent: dev
    skill: [stub-only]
    next: stub_review

  - name: stub_review
    agent: review
    next: stub_approval

  - name: stub_approval
    agent: genius
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: plan
    next: implement

  - name: implement
    agent: dev
    next: review
    
  - name: review
    agent: review
    conditions:
      - on_result: approved
        next: null
      - on_result: implement
        next: plan
