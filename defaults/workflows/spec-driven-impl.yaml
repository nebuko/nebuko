name: spec-driven-impl
description: "Spec-driven development: plan -> stub -> implement"

steps:
  - name: analyze
    agent: architect
    complexity: low  # triage + context-query drafting is cheap
    prompt: |
      Analysis turn: a human issue or request just arrived.
      - Decide what context @@context must collect (files, docs, facts).
      - Estimate complexity: `high` for architectural changes or many subsystems, `low` for a narrow change, otherwise omit it (@@context defaults to medium).
      - Delegate with `dispatch_next(appreciation='approved', complexity=…)` on the same turn as your message. Do not plan yet.
    next: context

  - name: context
    agent: context
    next: plan

  - name: plan
    agent: architect
    prompt: |
      Planning turn: @@context has returned. Follow the Planning skill: emit the single planning artifact (or revise it if your context has a `## Human Gate Decision`), then end with `dispatch_next(appreciation='approved', complexity=…)` on the same turn.
    next: stub
    conditions:
      - on_result: approved
        next: stub
      - on_result: rejected
        next: context

  - name: stub
    agent: dev
    skill: [stub-only]
    next: stub_review

  - name: stub_review
    agent: review
    next: stub_approval

  - name: stub_approval
    agent: architect
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: plan
    next: implement

  - name: implement
    agent: dev
    # A step's output is its posted comment (ADR-0013): `plan` is materialized
    # as a deterministic step input, its full state-stripped comment.
    inputs: [plan]
    next: review

  - name: review
    agent: review
    inputs: [plan, implement]  # fan-in: the architect plan + the dev output
    prompt: |
      Review the implementation against the plan.
      Plan under review: {{ plan }}
      Both step outputs are also materialized above as deterministic inputs.
    conditions:
      - on_result: approved
        next: null
      - on_result: implement
        next: plan
