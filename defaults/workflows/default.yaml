# Default workflow: the standard dev chain
# genius → ctx → genius (plan) → dev → review

name: default
description: "Standard development workflow: analyze → context → plan → implement → review"

trigger:
  agents: [genius]  # which @@mentions can start this workflow

steps:
  - name: analyze
    agent: genius
    complexity: low
    next: context

  - name: context
    agent: ctx
    next: plan

  - name: plan
    agent: genius
    next: implement
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: context

  - name: implement
    agent: dev
    next: review

  - name: review
    agent: review
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
