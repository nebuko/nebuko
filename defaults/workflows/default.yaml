# Default workflow: the standard dev chain
# architect → context → architect (plan) → dev → review

name: default
description: "Standard development workflow: analyze → context → plan → implement → review"

steps:
  - name: analyze
    agent: architect
    complexity: low
    prompt: |
      Analysis turn: a human issue or request just arrived.
      - Decide what context @@context must collect (files, docs, facts).
      - Estimate complexity: `high` for architectural changes or many subsystems, `low` for a narrow change, otherwise omit it (@@context defaults to medium).
      - Delegate with `dispatch_next(appreciation='approved', complexity=…)` on the same turn as your message. Do not plan yet.
    next: context

  - name: context
    agent: context
    next: plan

  - name: plan
    agent: architect
    prompt: |
      Planning turn: @@context has returned. Follow the Planning skill: emit the single planning artifact (or revise it if your context has a `## Human Gate Decision`), then end with `dispatch_next(appreciation='approved', complexity=…)` on the same turn. Never `hold` on this gated step.
    next: implement
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: context

  - name: implement
    agent: dev
    next: review
  
  - name: review
    agent: review
    # Fan-in (#755): the architect plan + the dev output, materialized once as
    # deterministic step inputs. A step that declares inputs is composed by
    # reference (issue #889), so neither is re-injected through the unscoped
    # reverse-comment-history walk.
    inputs: [plan, implement]
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
