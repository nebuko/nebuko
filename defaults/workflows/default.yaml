# Default workflow: the standard dev chain
# architect → context → architect (plan) → dev → review

name: default
description: "Standard development workflow: analyze → context → plan → implement → review"

steps:
  - name: analyze
    agent: architect
    complexity: low
    next: context

  - name: context
    agent: context
    next: plan

  - name: plan
    agent: architect
    next: implement
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: context

  - name: implement
    agent: dev
    next: review
  
  - name: review
    agent: review
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
