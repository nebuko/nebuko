# workflow.yaml
# Template for external projects to use the git-flow-ai workflow
#
# Instructions:
# 1. Copy this file into your project's .github/workflows/ directory
# 2. Add OPENROUTER_API_KEY and GH_PAT secrets to your repository
# 3. Customize inputs below if desired (all have sensible defaults)
# 4. Start using by mentioning @@genius, @@ctx, or @@dev in issues/PRs
#
# Required Secrets:
#   - OPENROUTER_API_KEY: Your OpenRouter API key
#   - GH_PAT: A GitHub Personal Access Token with repo scope
#
# For more information, see: https://github.com/olivier-norture/git-flow-ai

name: Git Flow AI

on:
  issues:
    types: [opened, edited, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  delegate-to-git-flow-ai:
    uses: olivier-norture/git-flow-ai/.github/workflows/openhands-multi-agent.yml@main
    with:
      # Model configuration (optional - sensible defaults provided)
      # genius_model: 'openrouter/deepseek/deepseek-v4-pro'
      # dev_model: 'openrouter/qwen/qwen3.6-27b'
      # ctx_model: 'openrouter/deepseek/deepseek-v4-flash'

      # LLM settings (optional)
      # llm_temperature: '0.2'
      # llm_seed: '42'
      # llm_base_url: 'https://openrouter.ai/api/v1/chat/completions'

      # Advanced settings (optional)
      # agent_script_url: ''
      # circuit_breaker_threshold: '20'

      # Infrastructure (optional)
      # python_version: '3.13'
      # enable_uv_cache: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
