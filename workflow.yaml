name: AI Dev Workflow (git-flow-ai)

on:
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    uses: olivier-norture/git-flow-ai/.github/workflows/openhands-multi-agent.yml@main
    with:
      # ───── Model Configuration ─────
      genius_model: "openrouter/deepseek/deepseek-v4-pro"
      dev_model_low: "openrouter/deepseek/deepseek-v4-flash"
      dev_model_medium: "openrouter/deepseek/deepseek-v4-flash"
      dev_model_high: "openrouter/deepseek/deepseek-v4-flash"
      ctx_model: "openrouter/deepseek/deepseek-v4-flash"
      review_model: "openrouter/deepseek/deepseek-v4-pro"
      # ───── API Configuration ─────
      api_base_url: "https://openrouter.ai/api/v1/chat/completions"
      # ───── Per-Model Base URL Overrides (optional) ─────
      # Set these to route specific models to different endpoints (e.g., local vLLM)
      # genius_base_url: "http://localhost:8000/v1/chat/completions"
      # dev_model_low_base_url: "http://localhost:8001/v1/chat/completions"
      # dev_model_medium_base_url: "http://localhost:8002/v1/chat/completions"
      # dev_model_high_base_url: "http://localhost:8003/v1/chat/completions"
      # ctx_base_url: "http://localhost:8004/v1/chat/completions"
      # ───── Advanced ─────
      genius_temperature: 0.2
      dev_temperature: 0.0
      llm_seed: 42
      circuit_breaker_threshold: 15
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GENIUS_API_KEY: ${{ secrets.GENIUS_API_KEY }}
      DEV_MODEL_LOW_API_KEY: ${{ secrets.DEV_MODEL_LOW_API_KEY }}
      DEV_MODEL_MEDIUM_API_KEY: ${{ secrets.DEV_MODEL_MEDIUM_API_KEY }}
      DEV_MODEL_HIGH_API_KEY: ${{ secrets.DEV_MODEL_HIGH_API_KEY }}
      CTX_API_KEY: ${{ secrets.CTX_API_KEY }}
      REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
