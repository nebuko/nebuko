name: OpenHands Multi-Agent Router

on:
  workflow_call:
    inputs:
      agent_config_path:
        description: 'Path to the layered YAML config file (providers → llms → agents)'
        required: false
        type: string
        default: 'agent-config.yaml'
      circuit_breaker_threshold:
        description: 'Circuit breaker threshold'
        required: false
        type: number
        default: 15
      pin_comment:
        description: 'When true, pin every agent step output comment for verbatim context injection (issue #617)'
        required: false
        type: boolean
        default: false
      history_comment_count:
        description: 'Number of most recent issue comments injected into each agent call (pinned comments are always added on top)'
        required: false
        type: number
        default: 5
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.13'
      enable_uv_cache:
        description: 'Enable uv cache'
        required: false
        type: boolean
        default: true
      prompt_body:
        description: 'The prompt/body text for the agent to process (required for external callers)'
        required: false
        type: string
        default: ''
      checkout_ref:
        description: 'Explicit ref (SHA, tag, or branch) for the workspace checkout. When empty, the checkout follows the workflow''s own commit if the workflow is checking out its own repository; otherwise the event default.'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label for workflow jobs (default: ubuntu-latest; e.g. "self-hosted" to use your own runners)'
        required: false
        type: string
        default: 'ubuntu-latest'
      CALLER_AUTH:
        description: 'When "on" (default), only OWNER/MEMBER/COLLABORATOR authors can trigger the workflow from issues/comments'
        required: false
        type: string
        default: 'on'
      TRUSTED_BOTS:
        description: 'JSON array of GitHub App bot logins whose continuation comments (function_call / workflow-continue / bot-trigger markers) may trigger the workflow without an OWNER/MEMBER/COLLABORATOR association. Gate commands stay human-only. Self-hosters put their own App''s bot login here.'
        required: false
        type: string
        default: '["nebuko[bot]"]'
      EXTRA_SECRET_1_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_1_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_2_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_2_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_3_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_3_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_4_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_4_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_5_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_5_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_6_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_6_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_7_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_7_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_8_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_8_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
      EXTRA_SECRET_9_NAME:
        description: 'Env var name materialized from the EXTRA_SECRET_9_VALUE secret (issue #834)'
        required: false
        type: string
        default: ''
    secrets:
      COMMANDCODE_API_KEY:
        description: 'API key for Command Code LLM provider (optional - only needed if you want to use it as provider)'
        required: false
      OPENCODE_GO_API_KEY:
        description: 'API key for the OpenCode LLM provider (optional - only needed if you want to use it as provider)'
        required: false
      OPENROUTER_API_KEY:
        description: 'API key for the OpenRouter LLM provider (optional - only needed if you want to use it as provider)'
        required: false
      CHEAPERINFERENCE_API_KEY:
        description: 'API key for the Cheaper Inference LLM provider (optional - only needed if you want to use it as provider)'
        required: false
      MISTRAL_API_KEY:
        description: 'API key for the Mistral LLM provider (optional - only needed if you want to use it as provider)'
        required: false
      LOCAL_VLLM_API_TOKEN:
        description: 'API key for vLLM (optional — only needed if using local vLLM provider)'
        required: false
      BRAVE_API_KEY:
        description: 'Brave Search API key (optional — only needed for the Brave Search MCP web-search tool)'
        required: false
      GH_PAT:
        description: 'Optional fallback GitHub token, used only when the OIDC token broker fails or is not configured'
        required: false
      EXTRA_SECRET_1_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_1_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_2_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_2_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_3_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_3_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_4_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_4_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_5_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_5_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_6_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_6_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_7_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_7_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_8_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_8_NAME input (issue #834)'
        required: false
      EXTRA_SECRET_9_VALUE:
        description: 'Value for the env var named by the EXTRA_SECRET_9_NAME input (issue #834)'
        required: false

permissions:
    contents: write
    pull-requests: write
    issues: write
    id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issues' && format('-issue-{0}', github.event.issue.number) || format('-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
    run-task:
        runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
        # actions: write lets setup-uv's post step save the uv cache; the
        # top-level token may be a broker App token without that scope.
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: write
        if: |
          github.event.action != 'closed' &&
          (
            github.event_name == 'workflow_call' ||
            (github.event_name == 'issues' &&
             (inputs.CALLER_AUTH == 'off' ||
              contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                       github.event.issue.author_association)) &&
             !startsWith(github.event.issue.body, '<!-- bot-agent-') &&
             !startsWith(github.event.issue.body, '<!-- bot-workflow-terminal -->') &&
             (contains(github.event.issue.body, '@@architect') ||
              contains(github.event.issue.body, '@@context') ||
              contains(github.event.issue.body, '@@dev') ||
              contains(github.event.issue.body, '@@review') ||
              contains(github.event.issue.body, '@@po') ||
              contains(github.event.issue.body, '@@genius') ||
              contains(github.event.issue.body, '@@ctx') ||
              contains(github.event.issue.body, '/nebuko'))) ||
            (github.event_name == 'issue_comment' &&
             !contains(github.event.comment.body, '<!-- bot-answer-continuation -->') &&
             (
              ((inputs.CALLER_AUTH == 'off' ||
                contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                         github.event.comment.author_association)) &&
               ((!startsWith(github.event.comment.body, '<!-- bot-agent-') &&
                 !startsWith(github.event.comment.body, '<!-- bot-workflow-terminal -->') &&
                 (contains(github.event.comment.body, '@@architect') ||
                  contains(github.event.comment.body, '@@context') ||
                  contains(github.event.comment.body, '@@dev') ||
                  contains(github.event.comment.body, '@@review') ||
                  contains(github.event.comment.body, '@@po') ||
                  contains(github.event.comment.body, '@@genius') ||
                  contains(github.event.comment.body, '@@ctx') ||
                  contains(github.event.comment.body, '/nebuko'))) ||
                contains(github.event.comment.body, '"function_call"') ||
                startsWith(github.event.comment.body, '<!-- bot-workflow-terminal --><!-- workflow-continue -->') ||
                contains(github.event.comment.body, '<!-- bot-trigger:'))) ||
              (github.event.comment.user.type == 'Bot' &&
               contains(fromJSON(inputs.TRUSTED_BOTS || '["nebuko[bot]"]'),
                        github.event.comment.user.login) &&
               (startsWith(github.event.comment.body, '<!-- bot-workflow-terminal --><!-- workflow-continue -->') ||
                (!startsWith(github.event.comment.body, '<!-- bot-workflow-terminal -->') &&
                 (contains(github.event.comment.body, '"function_call"') ||
                  contains(github.event.comment.body, '<!-- bot-trigger:'))))) ||
              (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.comment.author_association) &&
               !startsWith(github.event.comment.body, '<!-- bot-agent-') &&
               !startsWith(github.event.comment.body, '<!-- bot-workflow-terminal -->') &&
               (contains(github.event.comment.body, '/nebuko approve gate') ||
                contains(github.event.comment.body, '/nebuko reject gate')))
             ))
          )
        env:
            BOT_MARKER: "<!-- bot-workflow-terminal -->"
            CIRCUIT_BREAKER_THRESHOLD: ${{ inputs.circuit_breaker_threshold || 25 }}
            PYTHON_VERSION: ${{ inputs.python_version || '3.13' }}
            ENABLE_UV_CACHE: ${{ inputs.enable_uv_cache != false }}
            AGENT_CONFIG_PATH: ${{ inputs.agent_config_path || 'agent-config.yaml' }}

            BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}

            TRIGGER_AUTHOR_LOGIN: ${{ github.event.comment.user.login || github.event.issue.user.login }}
            TRIGGER_AUTHOR_TYPE: ${{ github.event.comment.user.type || github.event.issue.user.type }}
            TRIGGER_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.issue.author_association }}
            TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        steps:
            - name: Clean global git config
              run:
                git config --global --unset-all http.https://github.com/.extraheader || true
                git config --global --unset-all credential.helper || true

            - name: Acquire GitHub token (OIDC broker)
              id: gh_token
              env:
                BROKER_URL: ${{ vars.NEBUKO_BROKER_URL || 'https://token-broker.nebuko.dev/token' }}
                FALLBACK_PAT: ${{ secrets.GH_PAT }}
                FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                # Never fail the job: every failure path falls back to a static token.
                TOKEN=""
                [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "::warning::No OIDC token available (is id-token: write granted?)"
                SOURCE=""
                if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
                  OIDC_JWT=$(curl -sS --max-time 15 \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nebuko-broker" | jq -r '.value // empty' 2>/dev/null || true)
                  if [ -n "$OIDC_JWT" ]; then
                    BROKER_RESP=$(curl -sS --max-time 15 -X POST \
                      -H "Authorization: Bearer $OIDC_JWT" \
                      -H "Accept: application/json" \
                      -w '\n%{http_code}' "$BROKER_URL" 2>&1 || true)
                    BROKER_STATUS=$(printf '%s' "$BROKER_RESP" | tail -n 1)
                    BROKER_BODY=$(printf '%s' "$BROKER_RESP" | sed '$d')
                    TOKEN=$(printf '%s' "$BROKER_BODY" | jq -r '.token // empty' 2>/dev/null || true)
                    if [ -n "$TOKEN" ]; then
                      SOURCE="broker"
                    else
                      # Only error/message are echoed: never the raw body, which could hold a token.
                      DETAIL=$(printf '%s' "$BROKER_BODY" | jq -r '[.error, .message] | map(select(. != null)) | join(": ")' 2>/dev/null || true)
                      echo "::warning::Token broker returned no token ($BROKER_URL, HTTP $BROKER_STATUS${DETAIL:+, $DETAIL})"
                    fi
                  else
                    echo "::warning::Could not obtain an OIDC JWT from GitHub"
                  fi
                fi
                if [ -z "$TOKEN" ] && [ -n "$FALLBACK_PAT" ]; then
                  TOKEN="$FALLBACK_PAT"
                  SOURCE="pat"
                fi
                if [ -z "$TOKEN" ]; then
                  TOKEN="$FALLBACK_GITHUB_TOKEN"
                  SOURCE="github-token"
                  echo "::warning::Falling back to GITHUB_TOKEN: comments posted with it do not trigger follow-up workflow runs, so step chaining by comment will stall"
                fi
                echo "::add-mask::$TOKEN"
                echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
                echo "::notice::GitHub token resolved via $SOURCE"
                # Broker tokens are nebuko[bot] installation tokens: commit as the
                # bot so GitHub links the commits to the App's profile. The email
                # carries the bot's numeric user id (GET /users/nebuko[bot]).
                if [ "$SOURCE" = "broker" ]; then
                  echo "NEBUKO_GIT_AUTHOR_NAME=${NEBUKO_GIT_AUTHOR_NAME:-nebuko[bot]}" >> "$GITHUB_ENV"
                  echo "NEBUKO_GIT_AUTHOR_EMAIL=${NEBUKO_GIT_AUTHOR_EMAIL:-331982189+nebuko[bot]@users.noreply.github.com}" >> "$GITHUB_ENV"
                fi

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                ref: ${{ inputs.checkout_ref || (job.workflow_repository == github.repository && job.workflow_sha) || '' }}
                persist-credentials: false

            # Always a separate checkout, nebuko's own runs included: the engine
            # creates, merges and commits the feature branch in the workspace,
            # so running it from there would swap its own code mid-run (and a
            # conflicted merge would leave markers in modules it still imports).
            - name: Checkout nebuko engine
              uses: actions/checkout@v5
              with:
                repository: ${{ job.workflow_repository }}
                ref: ${{ job.workflow_sha }}
                path: .nebuko-engine
                persist-credentials: false

            - name: Locate nebuko engine
              run: |
                # Keep the engine checkout out of the caller's commits.
                echo "/.nebuko-engine/" >> .git/info/exclude
                echo "NEBUKO_ROOT=$GITHUB_WORKSPACE/.nebuko-engine" >> "$GITHUB_ENV"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "${{ env.PYTHON_VERSION || '3.13' }}"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: ${{ env.ENABLE_UV_CACHE != 'false' }}
                  # The broker's App token has no cache-write scope; save with
                  # the workflow's own token (actions: write above).
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # Single locked sync installs the SDK exactly once, from the SHA
            # pinned in pyproject.toml and recorded in uv.lock (issue #982).
            - name: Sync locked dependencies
              run: |
                  ENCODED=$(echo -n "x-access-token:${GH_TOKEN}" | base64 -w 0)
                  git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $ENCODED"
                  uv sync --project "$NEBUKO_ROOT" --extra runtime --locked --no-dev

            - name: "Materialize extra secret slots as env vars"
              env:
                EXTRA_SECRET_1_NAME: ${{ inputs.EXTRA_SECRET_1_NAME }}
                EXTRA_SECRET_1_VALUE: ${{ secrets.EXTRA_SECRET_1_VALUE }}
                EXTRA_SECRET_2_NAME: ${{ inputs.EXTRA_SECRET_2_NAME }}
                EXTRA_SECRET_2_VALUE: ${{ secrets.EXTRA_SECRET_2_VALUE }}
                EXTRA_SECRET_3_NAME: ${{ inputs.EXTRA_SECRET_3_NAME }}
                EXTRA_SECRET_3_VALUE: ${{ secrets.EXTRA_SECRET_3_VALUE }}
                EXTRA_SECRET_4_NAME: ${{ inputs.EXTRA_SECRET_4_NAME }}
                EXTRA_SECRET_4_VALUE: ${{ secrets.EXTRA_SECRET_4_VALUE }}
                EXTRA_SECRET_5_NAME: ${{ inputs.EXTRA_SECRET_5_NAME }}
                EXTRA_SECRET_5_VALUE: ${{ secrets.EXTRA_SECRET_5_VALUE }}
                EXTRA_SECRET_6_NAME: ${{ inputs.EXTRA_SECRET_6_NAME }}
                EXTRA_SECRET_6_VALUE: ${{ secrets.EXTRA_SECRET_6_VALUE }}
                EXTRA_SECRET_7_NAME: ${{ inputs.EXTRA_SECRET_7_NAME }}
                EXTRA_SECRET_7_VALUE: ${{ secrets.EXTRA_SECRET_7_VALUE }}
                EXTRA_SECRET_8_NAME: ${{ inputs.EXTRA_SECRET_8_NAME }}
                EXTRA_SECRET_8_VALUE: ${{ secrets.EXTRA_SECRET_8_VALUE }}
                EXTRA_SECRET_9_NAME: ${{ inputs.EXTRA_SECRET_9_NAME }}
                EXTRA_SECRET_9_VALUE: ${{ secrets.EXTRA_SECRET_9_VALUE }}
              run: uv run --no-sync --project "$NEBUKO_ROOT" python -m nebuko.engine.lib.secret_env

            - name: Run orchestration engine
              run: uv run --no-sync --project "$NEBUKO_ROOT" python -m nebuko.engine.run
              env:
                ENGINE_ADAPTER: github
                GFA_SOURCE: github
                GH_TOKEN: ${{ env.GH_TOKEN }}
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                AGENT_CONFIG_PATH: ${{ inputs.agent_config_path || 'agent-config.yaml' }}
                OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
                MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
                LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN }}
                COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
                OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
                PIN_COMMENT: ${{ inputs.pin_comment }}
                HISTORY_COMMENT_COUNT: ${{ inputs.history_comment_count }}
                PROMPT_BODY: ${{ inputs.prompt_body }}
                LOG_TO_FILE: "true"
                LOG_DIR: ${{ runner.temp }}/nebuko-task-logs
                NEBUKO_WORKFLOW_REF: ${{ job.workflow_ref }}

            - name: Upload console.txt artifact
              uses: actions/upload-artifact@v7
              if: always()
              with:
                path: ${{ runner.temp }}/nebuko-task-logs/console.txt
                archive: false
                if-no-files-found: ignore
                retention-days: 7

            - name: Upload app.txt artifact
              uses: actions/upload-artifact@v7
              if: always()
              with:
                path: ${{ runner.temp }}/nebuko-task-logs/app.txt
                archive: false
                if-no-files-found: ignore
                retention-days: 7

            - name: Upload events.jsonl artifact
              uses: actions/upload-artifact@v7
              if: always()
              with:
                path: ${{ runner.temp }}/nebuko-task-logs/events.jsonl
                archive: false
                if-no-files-found: ignore
                retention-days: 7

    agent-metrics:
        runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
        if: |
          github.event_name == 'issues' &&
          github.event.action == 'closed' &&
          github.event.issue.pull_request == null
        steps:
            - name: Clean global git config
              run:
                git config --global --unset-all http.https://github.com/.extraheader || true
                git config --global --unset-all credential.helper || true

            - name: Acquire GitHub token (OIDC broker)
              id: gh_token
              env:
                BROKER_URL: ${{ vars.NEBUKO_BROKER_URL || 'https://token-broker.nebuko.dev/token' }}
                FALLBACK_PAT: ${{ secrets.GH_PAT }}
                FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                # Never fail the job: every failure path falls back to a static token.
                TOKEN=""
                [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "::warning::No OIDC token available (is id-token: write granted?)"
                SOURCE=""
                if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
                  OIDC_JWT=$(curl -sS --max-time 15 \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nebuko-broker" | jq -r '.value // empty' 2>/dev/null || true)
                  if [ -n "$OIDC_JWT" ]; then
                    BROKER_RESP=$(curl -sS --max-time 15 -X POST \
                      -H "Authorization: Bearer $OIDC_JWT" \
                      -H "Accept: application/json" \
                      -w '\n%{http_code}' "$BROKER_URL" 2>&1 || true)
                    BROKER_STATUS=$(printf '%s' "$BROKER_RESP" | tail -n 1)
                    BROKER_BODY=$(printf '%s' "$BROKER_RESP" | sed '$d')
                    TOKEN=$(printf '%s' "$BROKER_BODY" | jq -r '.token // empty' 2>/dev/null || true)
                    if [ -n "$TOKEN" ]; then
                      SOURCE="broker"
                    else
                      # Only error/message are echoed: never the raw body, which could hold a token.
                      DETAIL=$(printf '%s' "$BROKER_BODY" | jq -r '[.error, .message] | map(select(. != null)) | join(": ")' 2>/dev/null || true)
                      echo "::warning::Token broker returned no token ($BROKER_URL, HTTP $BROKER_STATUS${DETAIL:+, $DETAIL})"
                    fi
                  else
                    echo "::warning::Could not obtain an OIDC JWT from GitHub"
                  fi
                fi
                if [ -z "$TOKEN" ] && [ -n "$FALLBACK_PAT" ]; then
                  TOKEN="$FALLBACK_PAT"
                  SOURCE="pat"
                fi
                if [ -z "$TOKEN" ]; then
                  TOKEN="$FALLBACK_GITHUB_TOKEN"
                  SOURCE="github-token"
                  echo "::warning::Falling back to GITHUB_TOKEN: comments posted with it do not trigger follow-up workflow runs, so step chaining by comment will stall"
                fi
                echo "::add-mask::$TOKEN"
                echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
                echo "::notice::GitHub token resolved via $SOURCE"
                # Broker tokens are nebuko[bot] installation tokens: commit as the
                # bot so GitHub links the commits to the App's profile. The email
                # carries the bot's numeric user id (GET /users/nebuko[bot]).
                if [ "$SOURCE" = "broker" ]; then
                  echo "NEBUKO_GIT_AUTHOR_NAME=${NEBUKO_GIT_AUTHOR_NAME:-nebuko[bot]}" >> "$GITHUB_ENV"
                  echo "NEBUKO_GIT_AUTHOR_EMAIL=${NEBUKO_GIT_AUTHOR_EMAIL:-331982189+nebuko[bot]@users.noreply.github.com}" >> "$GITHUB_ENV"
                fi

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                persist-credentials: false

            - name: Check if nebuko cache is needed
              id: check_nebuko
              run: |
                if [ ! -d ".nebuko-cache/src/nebuko/engine/lib" ]; then
                  echo "needed=true" >> $GITHUB_OUTPUT
                fi

            - name: Checkout nebuko repo (reusable workflow mode)
              if: steps.check_nebuko.outputs.needed == 'true'
              uses: actions/checkout@v5
              with:
                repository: ${{ job.workflow_repository }}
                ref: ${{ job.workflow_sha }}
                path: .nebuko-cache
                persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install project dependencies
              run: |
                # Install the engine manifest so pydantic/pyyaml (and future
                # core deps) come from pyproject.toml instead of drifting.
                # Fallback to the repo root mirrors the SCRIPT_PATH fallback
                # in the next step: reusable-workflow mode checks the engine
                # out into .nebuko-cache, self-hosted mode uses the repo root.
                if [ -f ".nebuko-cache/src/nebuko/engine/lib/agent_metrics.py" ]; then
                  PROJECT_ROOT=".nebuko-cache"
                else
                  PROJECT_ROOT="."
                fi
                python -m pip install "$PROJECT_ROOT"

            - name: Aggregate agent metrics
              env:
                  GITHUB_TOKEN: ${{ env.GH_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
              run: |
                if [ -f ".nebuko-cache/src/nebuko/engine/lib/agent_metrics.py" ]; then
                  SCRIPT_PATH=".nebuko-cache/src/nebuko/engine/lib/agent_metrics.py"
