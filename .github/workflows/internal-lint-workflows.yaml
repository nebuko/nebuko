name: Lint workflows

on:
  pull_request:
    paths:
      - "defaults/workflows/**"
      - ".nebuko/workflows/**"
      - "src/nebuko/engine/**"
      - ".github/workflows/internal-lint-workflows.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Lint workflow YAML
        env:
          PYTHONPATH: src
        run: |
          python -m nebuko.engine lint defaults/workflows/
          python -m nebuko.engine lint .nebuko/workflows/
