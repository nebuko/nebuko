name: OpenHands Multi-Agent Router

on:
  workflow_call:
    inputs:
      agent_config_path:
        description: 'Path to the layered YAML config file (providers → llms → agents)'
        required: false
        type: string
        default: 'agent-config.yaml'
      circuit_breaker_threshold:
        description: 'Circuit breaker threshold'
        required: false
        type: number
        default: 15
      summarizer_threshold:
        description: 'Summarizer threshold — number of comments before summarizer triggers'
        required: false
        type: number
        default: 100
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.13'
      enable_uv_cache:
        description: 'Enable uv cache'
        required: false
        type: boolean
        default: true
      prompt_body:
        description: 'The prompt/body text for the agent to process (required for external callers)'
        required: false
        type: string
        default: ''
    secrets:
      OPENROUTER_API_KEY:
        description: 'Default API key for the LLM provider (used as fallback)'
        required: true
      LOCAL_VLLM_API_TOKEN:
        description: 'API key for vLLM'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for API access'
        required: true
      GENIUS_API_KEY:
        description: 'API key override for the Genius agent (backward compat)'
        required: false
      DEV_MODEL_LOW_API_KEY:
        description: 'API key override for low-complexity dev tasks (backward compat)'
        required: false
      DEV_MODEL_MEDIUM_API_KEY:
        description: 'API key override for medium-complexity dev tasks (backward compat)'
        required: false
      DEV_MODEL_HIGH_API_KEY:
        description: 'API key override for high-complexity dev tasks (backward compat)'
        required: false
      CTX_API_KEY:
        description: 'API key override for the Ctx agent (backward compat)'
        required: false
      REVIEW_API_KEY:
        description: 'API key override for the Review agent (backward compat)'
        required: false
      ISSUE_API_KEY:
        description: 'API key override for the Issue agent (backward compat)'
        required: false
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    run-task:
        runs-on: self-hosted
        if: |
          github.event.action != 'closed' &&
          (
            github.event_name == 'workflow_call' ||
            (github.event_name == 'issues' &&
             (contains(github.event.issue.body, '@@genius') ||
              contains(github.event.issue.body, '@@ctx') ||
              contains(github.event.issue.body, '@@dev') ||
              contains(github.event.issue.body, '@@review') ||
              contains(github.event.issue.body, '@@issue') ||
              contains(github.event.issue.body, '@@issue-reviewer') ||
              contains(github.event.issue.body, '<agentRunConfig>'))) ||
            (github.event_name == 'issue_comment' &&
             (contains(github.event.comment.body, '@@genius') ||
              contains(github.event.comment.body, '@@ctx') ||
              contains(github.event.comment.body, '@@dev') ||
              contains(github.event.comment.body, '@@review') ||
              contains(github.event.comment.body, '@@issue') ||
              contains(github.event.comment.body, '@@issue-reviewer') ||
              contains(github.event.comment.body, '<agentRunConfig>')))
          )
        env:
            CIRCUIT_BREAKER_THRESHOLD: ${{ inputs.circuit_breaker_threshold || 25 }}
            PYTHON_VERSION: ${{ inputs.python_version || '3.13' }}
            ENABLE_UV_CACHE: ${{ inputs.enable_uv_cache != false }}
            AGENT_SCRIPT_URL: .github/scripts/agent_script.py
            AGENT_CONFIG_PATH: ${{ inputs.agent_config_path || 'agent-config.yaml' }}
            LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN || secrets.LOCAL_VLLM_API_TOKEN }}
            LITELLM_LOG: DEBUG
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Check if git-flow-ai checkout is needed
              id: check_gfa
              shell: bash
              run: |
                if [ -f ".agents/prompts/genius.md" ]; then
                  echo "needed=false" >> $GITHUB_OUTPUT
                else
                  echo "needed=true" >> $GITHUB_OUTPUT
                fi

            - name: Checkout git-flow-ai repo (reusable workflow mode)
              if: steps.check_gfa.outputs.needed == 'true'
              uses: actions/checkout@v5
              with:
                repository: olivier-norture/git-flow-ai
                path: .git-flow-ai-cache
                token: ${{ secrets.GH_PAT }}

            - name: Normalize GitHub Event Data
              run: |
                EVENT_PATH="$GITHUB_EVENT_PATH"
                
                # Normalize based on event type
                if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
                  TARGET_NUMBER="${{ github.event.issue.number }}"
                  TRIGGER_BODY=$(jq -r '.comment.body // ""' "$EVENT_PATH")
                  TRIGGER_AUTHOR=$(jq -r '.comment.user.login // ""' "$EVENT_PATH")
                  EVENT_TYPE="issue_comment"
                elif [[ "${{ github.event_name }}" == "issues" ]]; then
                  TARGET_NUMBER="${{ github.event.issue.number }}"
                  TRIGGER_BODY=$(jq -r '.issue.body // ""' "$EVENT_PATH")
                  TRIGGER_AUTHOR=$(jq -r '.issue.user.login // ""' "$EVENT_PATH")
                  EVENT_TYPE="issues"
                elif [[ "${{ github.event_name }}" == "workflow_call" ]]; then
                  TARGET_NUMBER=0
                  TRIGGER_BODY="${{ inputs.prompt_body }}"
                  TRIGGER_AUTHOR="${{ github.triggering_actor || github.actor }}"
                  EVENT_TYPE="workflow_call"
                else
                  echo "Unknown event type: ${{ github.event_name }}"
                  exit 1
                fi

                # Use a custom delimiter to handle multi-line strings
                {
                  echo "TRIGGER_BODY<<EOF"
                  echo "$TRIGGER_BODY"
                  echo "EOF"
                } >> "$GITHUB_ENV"

                # Simple variables can remain as is, provided they contain no newlines
                echo "TARGET_NUMBER=$TARGET_NUMBER" >> $GITHUB_ENV
                echo "TRIGGER_AUTHOR=$TRIGGER_AUTHOR" >> $GITHUB_ENV
                echo "EVENT_TYPE=$EVENT_TYPE" >> $GITHUB_ENV
                echo "Normalized event: $EVENT_TYPE -> TARGET_NUMBER=$TARGET_NUMBER"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "${{ env.PYTHON_VERSION || '3.13' }}"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: ${{ env.ENABLE_UV_CACHE != 'false' }}

            - name: Install OpenHands dependencies
              run: |
                  # Install OpenHands SDK and tools from git repository
                  uv pip install --system "openhands-sdk @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-sdk"
                  uv pip install --system "openhands-tools @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-tools"

            - name: Resolve Agent Configuration
              run: |
                  echo "Debug: Checking trigger body..."
                  PROMPT_BASE=""

                  # Determine prompt and script locations by checking which path exists
                  if [ -d "$GITHUB_WORKSPACE/.git-flow-ai-cache/.agents/prompts" ]; then
                    PROMPT_BASE="$GITHUB_WORKSPACE/.git-flow-ai-cache/.agents/prompts"
                    echo "AGENT_SCRIPT_URL=$GITHUB_WORKSPACE/.git-flow-ai-cache/.github/scripts/agent_script.py" >> $GITHUB_ENV
                  else
                    PROMPT_BASE=".agents/prompts"
                    echo "AGENT_SCRIPT_URL=.github/scripts/agent_script.py" >> $GITHUB_ENV
                  fi

                  # Step 1: Try to extract agentRunConfig JSON block
                  AGENT_CONFIG=$(echo "$TRIGGER_BODY" | sed -n '/<agentRunConfig>/,/<\/agentRunConfig>/p' | sed '1s/.*<agentRunConfig>//; $s/<\/agentRunConfig>.*//' | tr -d '\n' | jq -c '.' 2>/dev/null || echo "")

                  if [ -z "$AGENT_CONFIG" ]; then
                    # Fallback: try trailing JSON object with "task" field (only valid agent names, outside code blocks)
                    AGENT_CONFIG=$(echo "$TRIGGER_BODY" | grep -oP '\{[^{}]*"task"\s*:\s*"(?:ctx|genius|dev|review|issue|issue-reviewer)"[^{}]*\}' | tail -1 | jq -c '.' 2>/dev/null || echo "")
                  fi

                  # Step 2: Check if trigger is from a bot agent (human-vs-agent guard)
                  IS_BOT_COMMENT=0
                  if echo "$TRIGGER_BODY" | head -5 | grep -q '<!-- bot-agent-'; then
                    IS_BOT_COMMENT=1
                  fi

                  # Step 3: Parse JSON config or fall back to @@mention for humans only
                  if [ -n "$AGENT_CONFIG" ]; then
                    # JSON-based invocation (agent→agent)
                    TASK=$(echo "$AGENT_CONFIG" | jq -r '.task // empty')
                    CONFIG_COMPLEXITY=$(echo "$AGENT_CONFIG" | jq -r '.complexity // "medium"')
                    CONFIG_REASONING=$(echo "$AGENT_CONFIG" | jq -r '.reasoning // "none"')
                    CONFIG_TEMPERATURE=$(echo "$AGENT_CONFIG" | jq -r '.temperature // empty')
                    CONFIG_ROUND=$(echo "$AGENT_CONFIG" | jq -r '.round // empty')
                    CONFIG_MODEL=$(echo "$AGENT_CONFIG" | jq -r '.model // empty')
                    CONFIG_SKILLS=$(echo "$AGENT_CONFIG" | jq -r '.skills // empty')
                    CONFIG_TOP_P=$(echo "$AGENT_CONFIG" | jq -r '.top_p // empty')
                    CONFIG_TOP_K=$(echo "$AGENT_CONFIG" | jq -r '.top_k // empty')
                    CONFIG_REPETITION_PENALTY=$(echo "$AGENT_CONFIG" | jq -r '.repetition_penalty // empty')

                    echo "Parsed agentRunConfig: task=$TASK complexity=$CONFIG_COMPLEXITY reasoning=$CONFIG_REASONING"
                  elif [ "$IS_BOT_COMMENT" -eq 0 ]; then
                    # @@mention fallback (human only)
                    LAST_AGENT=$(echo "$TRIGGER_BODY" | grep -o '@@genius\|@@ctx\|@@dev\|@@review\|@@issue\|@@issue-reviewer' | tail -1)
                    TASK="${LAST_AGENT#@@}"
                    CONFIG_COMPLEXITY="medium"
                    CONFIG_REASONING="none"
                    CONFIG_TEMPERATURE=""
                    CONFIG_ROUND=""
                    CONFIG_MODEL=""
                    CONFIG_SKILLS=""
                    CONFIG_TOP_P=""
                    CONFIG_TOP_K=""
                    CONFIG_REPETITION_PENALTY=""
                    echo "Fallback to @@mention: $LAST_AGENT (human trigger)"
                  else
                    # Bot comment with no JSON and no @@mention — skip
                    echo "Bot comment without agentRunConfig or @@mention. Skipping."
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    exit 0
                  fi

                  # Step 4: Validate task
                  if [ -z "$TASK" ]; then
                    echo "No valid task found in trigger body. Skipping."
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    exit 0
                  fi

                  # Export TASK for loop prevention guards (Bug Fix #1)
                  echo "TASK=$TASK" >> $GITHUB_ENV

                  # Step 5: Map task to agent role and prompt location
                  # The agent script loads model/provider/temperature from the config file
                  case "$TASK" in
                      "genius")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/genius.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=genius" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          ;;
                      "ctx")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/ctx.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=ctx" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV

                          # Complexity-based context depth
                          COMPLEXITY=$(echo "$CONFIG_COMPLEXITY" | tr '[:upper:]' '[:lower:]')
                          case "$COMPLEXITY" in
                              "low")
                                  echo "COMPLEXITY=low" >> $GITHUB_ENV
                                  ;;
                              "high")
                                  echo "COMPLEXITY=high" >> $GITHUB_ENV
                                  ;;
                              *)
                                  echo "COMPLEXITY=medium" >> $GITHUB_ENV
                                  ;;
                          esac
                          ;;
                      "dev")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/dev.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=dev" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV

                          # Complexity-based model selection (via config file)
                          COMPLEXITY=$(echo "$CONFIG_COMPLEXITY" | tr '[:upper:]' '[:lower:]')
                          case "$COMPLEXITY" in
                              "low")
                                  echo "COMPLEXITY=low" >> $GITHUB_ENV
                                  ;;
                              "high")
                                  echo "COMPLEXITY=high" >> $GITHUB_ENV
                                  ;;
                              *)
                                  echo "COMPLEXITY=medium" >> $GITHUB_ENV
                                  ;;
                          esac
                          ;;
                      "review")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/review.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=review" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          ;;
                      "issue")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/issue.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=issue" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          ;;
                      "issue-reviewer")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/issue-reviewer.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=issue-reviewer" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          ;;
                      "summarize")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/summarize.md" >> $GITHUB_ENV
                          echo "ROLE_NAME=summarize" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          ;;
                      *)
                          echo "Unknown task: $TASK"
                          echo "SKIP_AGENT=true" >> $GITHUB_ENV
                          exit 1
                          ;;
                  esac

                  # Step 6: Export reasoning level for agent_script.py
                  echo "LLM_REASONING=${CONFIG_REASONING}" >> $GITHUB_ENV

                  # Step 7: Export round counter for agent context
                  if [ -n "$CONFIG_ROUND" ]; then
                      echo "AGENT_ROUND=${CONFIG_ROUND}" >> $GITHUB_ENV
                  else
                      echo "AGENT_ROUND=" >> $GITHUB_ENV
                  fi

                  # Step 8: Export skills field (plumbing only — no-op for now)
                  echo "AGENT_SKILLS=${CONFIG_SKILLS}" >> $GITHUB_ENV

                  # Step 9: Export per-invocation overrides for agent_script.py
                  echo "CONFIG_MODEL=${CONFIG_MODEL}" >> $GITHUB_ENV
                  echo "CONFIG_TEMPERATURE=${CONFIG_TEMPERATURE}" >> $GITHUB_ENV
                  echo "CONFIG_TOP_P=${CONFIG_TOP_P}" >> $GITHUB_ENV
                  echo "CONFIG_TOP_K=${CONFIG_TOP_K}" >> $GITHUB_ENV
                  echo "CONFIG_REPETITION_PENALTY=${CONFIG_REPETITION_PENALTY}" >> $GITHUB_ENV

                  echo "Resolved agent: ROLE_NAME=$TASK MODEL=from-config COMPLEXITY=${COMPLEXITY}"

            - name: Prevent all agent-trigger loops & human ping guard
              run: |
                  # Guard 1: Block same-agent loops, allow cross-agent calls
                  CALLER_AGENT=$(echo "$TRIGGER_BODY" | sed -n 's/.*<!-- bot-agent-\([a-z]*\) -->.*/\1/p')
                  if [[ -n "$CALLER_AGENT" ]]; then
                      TARGET_AGENT="$TASK"
                      if [[ "$CALLER_AGENT" == "$TARGET_AGENT" ]]; then
                        echo "Same-agent loop detected ($CALLER_AGENT calling itself). Skipping."
                        echo "SKIP_AGENT=true" >> $GITHUB_ENV
                        exit 0
                      else
                        echo "Cross-agent call ($CALLER_AGENT -> $TARGET_AGENT). Allowing."
                        echo "SKIP_AGENT=false" >> $GITHUB_ENV
                        exit 0
                      fi
                  else
                    echo "Event type ${{ env.EVENT_TYPE }} - skipping same-agent loop check (no bot marker expected)"

                    # Guard 2: If human is pinged alongside agent, skip (let human orchestrate)
                    # Only applies to human-triggered comments (no bot marker present)
                    HAS_AGENT_PING=$(echo "$TRIGGER_BODY" | grep -c '@@genius\|@@ctx\|@@dev\|@@issue\|@@issue-reviewer' || true)
                    HAS_HUMAN_PING=$(echo "$TRIGGER_BODY" | grep -o '@[a-zA-Z0-9_-]\+' | grep -vc '@@genius\|@@ctx\|@@dev\|@@issue\|@@issue-reviewer\|@genius\|@ctx\|@dev\|@issue\|@issue-reviewer' || true)
                    if [[ "$HAS_AGENT_PING" -gt 0 && "$HAS_HUMAN_PING" -gt 0 ]]; then
                      echo "Human ping + agent ping detected. Skipping to let human orchestrate."
                      echo "SKIP_AGENT=true" >> $GITHUB_ENV
                      exit 0
                    fi
                  fi

                  echo "SKIP_AGENT=false" >> $GITHUB_ENV

            - name: Check Circuit Breaker
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                REPO_NAME="${{ github.repository }}"
                TARGET_NUMBER="${{ env.TARGET_NUMBER }}"
                ISSUE_AUTHOR="${{ env.TRIGGER_AUTHOR }}"
                
                # Fetch all comments on the issue
                COMMENT_HISTORY=$(gh api /repos/$REPO_NAME/issues/$TARGET_NUMBER/comments \
                  --jq '.[] | .body' | tr -d '\r')
                
                # Count bot markers, excluding summary markers (which are not agent calls)
                BOT_MARKER_COUNT=$(echo "$COMMENT_HISTORY" | grep -c '<!-- bot-agent-' || true)
                SUMMARY_MARKER_COUNT=$(echo "$COMMENT_HISTORY" | grep -c '<!-- bot-agent-summary -->' || true)
                AGENT_CALLS=$(( (BOT_MARKER_COUNT - SUMMARY_MARKER_COUNT) / 2 ))
                
                echo "Agent calls detected: $AGENT_CALLS (threshold: $CIRCUIT_BREAKER_THRESHOLD)"
                
                if [[ "$AGENT_CALLS" -ge "$CIRCUIT_BREAKER_THRESHOLD" ]]; then
                    echo "CIRCUIT_BREAKER_TRIPPED=true" >> $GITHUB_ENV
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    
                    # Build circuit breaker comment line by line
                    {
                      echo "<!-- bot-agent-genius -->"
                      echo ""
                      echo "🚨 **Circuit Breaker Tripped** — Agent Loop Threshold Reached"
                      echo ""
                      echo "This issue has triggered $AGENT_CALLS agent calls (threshold: $CIRCUIT_BREAKER_THRESHOLD)."
                      echo "Further automated agent execution has been **halted** to prevent an infinite loop."
                      echo ""
                      echo "👉 **Action Required:** @$ISSUE_AUTHOR please review the conversation and decide next steps:"
                      echo "- If the task is complete, close this issue."
                      echo "- If more work is needed, reset the conversation by posting \`@@genius reset\` (or manually close/reopen)."
                      echo ""
                      echo "🔗 [View workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                    } > /tmp/circuit_breaker_comment.md
                    
                    # Post the comment
                    gh api /repos/$REPO_NAME/issues/$TARGET_NUMBER/comments \
                      -f body=@/tmp/circuit_breaker_comment.md
                else
                    echo "CIRCUIT_BREAKER_TRIPPED=false" >> $GITHUB_ENV
                fi

            - name: Check Summarizer Gate
              id: summarize_gate
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SUMMARIZER_THRESHOLD: ${{ inputs.summarizer_threshold || 100 }}
              run: |
                echo "::group::[Step] Check Summarizer Gate"
                REPO_NAME="${{ github.repository }}"
                ISSUE_NUMBER="${{ env.TARGET_NUMBER }}"

                # Count non-bot-user comments
                COMMENT_COUNT=$(gh api /repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
                  --jq 'length')

                echo "Comment count: $COMMENT_COUNT (threshold: $SUMMARIZER_THRESHOLD)"

                # Check if summary already exists (capture full body via jq array indexing)
                SUMMARY_EXISTS=$(gh api /repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
                  --jq -r '[.[] | select(.body | contains("<!-- bot-agent-summary -->"))][0].body // empty' || true)

                echo "Summarizer threshold: $SUMMARIZER_THRESHOLD"

                # Trigger summarizer if threshold exceeded AND no existing summary
                if [ "$COMMENT_COUNT" -ge "$SUMMARIZER_THRESHOLD" ] && [ -z "$SUMMARY_EXISTS" ]; then
                  echo "Threshold exceeded. Summarizer will run next."
                  echo "SUMMARIZER_NEEDED=true" >> $GITHUB_OUTPUT
                  echo "SKIP_AGENT=true" >> $GITHUB_ENV
                else
                  echo "No summarizer action needed (count=$COMMENT_COUNT, exists=${SUMMARY_EXISTS:+yes}:${SUMMARY_EXISTS:-no})"
                  echo "SUMMARIZER_NEEDED=false" >> $GITHUB_OUTPUT
                fi

                echo "::endgroup::"

            - name: Post Summarizer Trigger Comment
              if: steps.summarize_gate.outputs.SUMMARIZER_NEEDED == 'true'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ env.TARGET_NUMBER }}
                token: ${{ secrets.GH_PAT }}
                body: |
                  <agentRunConfig>
                  {"task": "summarize", "complexity": "low"}
                  </agentRunConfig>
                tag: "<!-- bot-agent-summary -->"
                mode: replace

            - name: Post Acknowledgment Comment
              id: ack_comment
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ env.TARGET_NUMBER }}
                token: ${{ secrets.GH_PAT }}
                tag: "<!-- bot-agent-${{ env.ROLE_NAME }} -->"
                mode: replace
                body: |
                  <!-- bot-agent-${{ env.ROLE_NAME }} -->
                  🤖 **${{ env.ROLE_NAME }} agent started** — [View workflow run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            - name: Save acknowledgment comment ID
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              run: echo "ACK_COMMENT_ID=${{ steps.ack_comment.outputs.comment-id }}" >> $GITHUB_ENV

            - name: Save acknowledgment comment GraphQL node ID
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              run: |
                NODE_ID=$(gh api "/repos/${{ github.repository }}/issues/comments/${{ env.ACK_COMMENT_ID }}" --jq '.node_id')
                echo "ACK_COMMENT_NODE_ID=$NODE_ID" >> $GITHUB_ENV
              env:
                GH_TOKEN: ${{ secrets.GH_PAT }}

            - name: Prepare Agent Query Context
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                ISSUE_TEMPLATE: |
                  # 📰 GITHUB CONTEXT

                  An issue comment was triggered. Please review the details below (including full history) and take appropriate action.

                  ## Issue Author
                  {author}

                  ## Issue Title
                  {title}

                  ## Issue Original Description
                  {body}

                  ---

                  ## Full Comment History
                  {history}
              run: |
                EVENT_PATH="${{ github.event_path }}"
                REPO_NAME="${{ github.repository }}"
                
                ISSUE_NUMBER="${{ env.TARGET_NUMBER }}"
                export ISSUE_TITLE=$(jq -r '.issue.title // "No Title"' "$EVENT_PATH")
                export ISSUE_BODY=$(jq -r '.issue.body // "No Description"' "$EVENT_PATH")
                export ISSUE_AUTHOR=$(jq -r '.issue.user.login // "unknown"' "$EVENT_PATH")
                
                export COMMENT_HISTORY=$(gh api /repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
                  --jq '.[] | "### \(.user.login) a écrit :\n\(.body)\n---\n"' | tr -d '\r')
                if [[ -z "$COMMENT_HISTORY" ]]; then
                  export COMMENT_HISTORY="No previous comments"
                fi

                # If a bot-agent-summary comment exists, prefer summary + recent comments
                SUMMARY_LINE=$(echo "$COMMENT_HISTORY" | grep -m1 '<!-- bot-agent-summary -->' || true)
                if [[ -n "$SUMMARY_LINE" ]]; then
                  echo "Summary marker found. Using summary + last 5 comments only."
                  # Extract the summary JSON (the block after the marker)
                  SUMMARY_JSON=$(echo "$COMMENT_HISTORY" | sed -n '/<!-- bot-agent-summary -->/,/^---/p' | sed '1d' | head -n -1)
                  # Get last 5 comments
                  RECENT_COMMENTS=$(gh api /repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
                    --jq '.[-5:] | .[] | "### \(.user.login) a écrit :\n\(.body)\n---\n"' | tr -d '\r')
                  printf -v COMMENT_HISTORY '### 📋 Issue Summary (auto-generated)\n%s\n\n---\n### Recent Comments:\n%s' "$SUMMARY_JSON" "$RECENT_COMMENTS"
                fi
                
                # Format and write out using a safe single-line python execution
                python3 -c 'import os; print(os.environ["ISSUE_TEMPLATE"].format(title=os.environ.get("ISSUE_TITLE",""), body=os.environ.get("ISSUE_BODY",""), author=os.environ.get("ISSUE_AUTHOR","unknown"), history=os.environ.get("COMMENT_HISTORY","")))' > /tmp/ready_prompt.md
                
                echo "AGENT_QUERY_PATH=/tmp/ready_prompt.md" >> $GITHUB_ENV

            - name: Configure git to use GH_PAT for workflow file access
              if: env.SKIP_AGENT == 'false'
              run: |
                git config --local --unset http.https://github.com/.extraheader || true
                git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

            - name: Run OpenHands Agent
              if: env.SKIP_AGENT == 'false'
              id: openhands_agent
              timeout-minutes: 30
              env:
                GH_TOKEN: ${{ secrets.GH_PAT }}
                AGENT_CONFIG_PATH: ${{ env.AGENT_CONFIG_PATH || inputs.agent_config_path || 'agent-config.yaml' }}
                LLM_API_KEY: ${{ env.LLM_API_KEY || secrets.OPENROUTER_API_KEY }}
                LLM_BASE_URL: ${{ env.LLM_BASE_URL || env.API_BASE_URL || 'https://openrouter.ai/api/v1/chat/completions' }}
                LLM_REASONING: ${{ env.LLM_REASONING }}
                COMPLEXITY: ${{ env.COMPLEXITY }}
                CONFIG_MODEL: ${{ env.CONFIG_MODEL }}
                CONFIG_TEMPERATURE: ${{ env.CONFIG_TEMPERATURE }}
              run: |
                echo "Running agent as [@$ROLE_NAME] using prompt: $PROMPT_LOCATION"
                if [[ "$AGENT_SCRIPT_URL" =~ ^https?:// ]]; then
                  curl -sSL "$AGENT_SCRIPT_URL" -o /tmp/agent_script.py
                    AGENT_SCRIPT_PATH="/tmp/agent_script.py"
                else
                    AGENT_SCRIPT_PATH="$AGENT_SCRIPT_URL"
                fi

                FINAL_PROMPT_FILE="/tmp/final_prompt.md"

                cat "$PROMPT_LOCATION" > $FINAL_PROMPT_FILE
                echo -e "\n\n--- USER REQUEST / GITHUB CONTEXT ---\n" >> $FINAL_PROMPT_FILE
                cat "$AGENT_QUERY_PATH" >> $FINAL_PROMPT_FILE

                # Inject git diff for review agent
                if [ "$ROLE_NAME" = "review" ]; then
                    echo -e "\n\n--- GIT DIFF ---\n" >> $FINAL_PROMPT_FILE

                    # --- Enhanced PR Discovery for Review Agent ---
                    # Strategy: API-first discovery of PRs linked to the current issue, with regex fallback.
                    ISSUE_NUMBER="${{ env.TARGET_NUMBER }}"
                    PR_NUMBER=""

                    # 1. Primary: Query GitHub API for open PRs referencing this issue
                    if [ "$ISSUE_NUMBER" != "0" ] && [ -n "$ISSUE_NUMBER" ]; then
                      PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --search "is:pr #$ISSUE_NUMBER" --json number --jq '.[0].number' 2>/dev/null || echo "")
                    fi

                    # 2. Fallback: Regex scan of comment history for "PR #<digits>" pattern
                    if [ -z "$PR_NUMBER" ]; then
                      PR_NUMBER=$(grep -oP 'PR #\K\d+' "$AGENT_QUERY_PATH" 2>/dev/null | tail -1 || echo "")
                    fi

                    # 3. Inject diff or failure marker
                    if [ -n "$PR_NUMBER" ]; then
                        gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" >> $FINAL_PROMPT_FILE 2>/dev/null || echo "(no diff available for PR#$PR_NUMBER)" >> $FINAL_PROMPT_FILE
                    else
                        echo "(no PR found linked to issue#$ISSUE_NUMBER)" >> $FINAL_PROMPT_FILE
                    fi
                fi
                # 2. Maintenant on ne passe qu'un seul argument au script !
                # 2>&1 fusionne stderr dans stdout, stdbuf désactive le buffering pour une écriture immédiate
                stdbuf -oL -eL uv run python "$AGENT_SCRIPT_PATH" "$FINAL_PROMPT_FILE" 2>&1 | tee console.log

            - name: Clean and Prepare Comment
              if: always() && env.SKIP_AGENT == 'false'
              shell: python
              run: |
                import re
                import os
                import logging

                logging.basicConfig(level=logging.INFO)
                logger = logging.getLogger(__name__)

                # Get the issue/PR author for pinging on failure
                trigger_author = os.environ.get('TRIGGER_AUTHOR', '')
                author_ping = f"@{trigger_author} " if trigger_author else ""

                # Path A: Check for structured final message file
                if os.path.isfile("final_message.txt") and os.path.getsize("final_message.txt") > 0:
                    with open("final_message.txt", "r", encoding="utf-8") as f:
                        content = f.read().strip()

                    # Check for sentinel indicating no final message was extracted
                    if content.startswith("__NO_FINAL_MESSAGE__"):
                        logger.warning("No final message from agent (sentinel detected), falling back to console.log")
                        # Extract and preserve the metrics comment from the sentinel file
                        metrics_match = re.search(r'<!-- agent-metrics:.*?-->', content)
                        metrics_comment = metrics_match.group(0) if metrics_match else ""
                    else:
                        metrics_match = re.search(r'<!-- agent-metrics:.*?-->', content)
                        metrics_comment = metrics_match.group(0) if metrics_match else ""
                        content = re.sub(r'\n?\n?<!-- agent-metrics:.*?-->', '', content).strip()

                        if content:
                            logger.info(f"Using final_message.txt ({len(content)} characters)")
                            # Safety truncation (should already be truncated by agent_script.py)
                            if len(content) > 60000:
                                content = content[:60000] + "\n\n...*(comment truncated due to size limit)*"

                            # Re-add metrics comment if present
                            if metrics_comment:
                                content += "\n\n" + metrics_comment

                            with open("github_comment.md", "w", encoding="utf-8") as f_out:
                                f_out.write(content)
                            with open(os.environ['GITHUB_ENV'], 'a') as ge:
                                ge.write("HAS_COMMENT=true\n")
                            exit(0)
                        else:
                            logger.warning("final_message.txt has no meaningful content, falling back to console.log")
                            # We have metrics_comment preserved from above

                    # Path B: Fallback to console.log parsing (final_message.txt was empty/sentinel)
                    if os.path.isfile("console.log") and os.path.getsize("console.log") > 0:
                        with open("console.log", "r", encoding="utf-8") as f:
                            log_content = f.read()

                        # Try to find the last "Message from Agent" block
                        blocks = log_content.split("Message from Agent ─────────────────────────────────────────────────────────────")

                        if len(blocks) > 1:
                            last_message = blocks[-1].split("Tokens:")[0].strip()
                            last_message = re.sub(r'{"asctime":.*"message": "Task completed successfully"}', '', last_message).strip()
                        else:
                            # Fallback: take last 50 meaningful lines (reduced from 200)
                            lines = log_content.strip().split('\n')
                            # Filter out pure JSON log lines
                            meaningful_lines = [l for l in lines if not re.match(r'^\s*\{', l)]
                            last_message = '\n'.join(meaningful_lines[-50:]) if meaningful_lines else '\n'.join(lines[-50:])

                        # Truncate at paragraph boundary if needed
                        if len(last_message) > 60000:
                            last_message = last_message[:60000]
                            last_break = last_message.rfind("\n\n")
                            if last_break > 30000:
                                last_message = last_message[:last_break]
                            last_message += "\n\n...*(comment truncated due to size limit)*"

                        if not last_message.strip():
                            last_message = author_ping + "> ⚠️ The agent crashed or produced no readable output. Please check the full logs in the workflow run."

                        # Re-add metrics comment if we preserved one from the sentinel
                        if metrics_comment:
                            last_message += "\n\n" + metrics_comment

                        with open("github_comment.md", "w", encoding="utf-8") as f_out:
                            f_out.write(last_message)
                        with open(os.environ['GITHUB_ENV'], 'a') as ge:
                            ge.write("HAS_COMMENT=true\n")
                        exit(0)

                    # Path C: No console.log either - agent likely crashed before producing output
                    fallback = author_ping + "> ⚠️ The agent crashed or timed out before producing output. Please check the full logs in the workflow run."
                    if metrics_comment:
                        fallback += "\n\n" + metrics_comment
                    with open("github_comment.md", "w", encoding="utf-8") as f_out:
                        f_out.write(fallback)
                    with open(os.environ['GITHUB_ENV'], 'a') as ge:
                        ge.write("HAS_COMMENT=true\n")
                    exit(0)

                # Path D: final_message.txt doesn't exist at all (agent script didn't run)
                fallback = author_ping + "> ⚠️ The agent did not produce a final message. Please check the full logs in the workflow run."
                with open("github_comment.md", "w", encoding="utf-8") as f_out:
                    f_out.write(fallback)
                with open(os.environ['GITHUB_ENV'], 'a') as ge:
                    ge.write("HAS_COMMENT=true\n")

            - name: Add bot marker to comment
              if: always() && env.SKIP_AGENT == 'false'
              shell: python
              run: |
                import os
                role = os.environ.get("ROLE_NAME", "unknown")
                marker = f"<!-- bot-agent-{role} -->"
                agent_display_names = {"genius": "Genius", "ctx": "Ctx", "dev": "Developer", "review": "Reviewer", "issue": "Issue", "issue-reviewer": "Issue Reviewer", "summarize": "Summarizer"}
                display_name = agent_display_names.get(role, role.capitalize())
                with open("github_comment.md", "r") as f:
                    content = f.read()
                with open("github_comment.md", "w") as f:
                    f.write(marker + "\n*" + display_name + " answer*\n\n" + content)

            - name: Post Agent Comment to GitHub
              if: always() && env.HAS_COMMENT == 'true' && env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ env.TARGET_NUMBER }}
                body-path: ./github_comment.md
                token: ${{ secrets.GH_PAT }}
                tag: "<!-- bot-agent-${{ env.ROLE_NAME }} -->"
                mode: create

            - name: Minimize acknowledgment comment
              if: always() && env.HAS_COMMENT == 'true' && env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0' && env.ACK_COMMENT_ID != '' && env.ACK_COMMENT_NODE_ID != ''
              run: |
                echo "Minimizing comment $ACK_COMMENT_ID (node: $ACK_COMMENT_NODE_ID)..."
                gh api graphql -f query='
                  mutation($subjectId: ID!) {
                    minimizeComment(input: {subjectId: $subjectId, classifier: OUTDATED}) {
                      minimizedComment { minimizedReason }
                    }
                  }' -f subjectId="$ACK_COMMENT_NODE_ID"
              env:
                GH_TOKEN: ${{ secrets.GH_PAT }}

            - name: Post Additional Message Parts
              if: always() && env.HAS_COMMENT == 'true' && env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0' && hashFiles('final_message_parts_count.txt') != ''
              run: |
                PARTS_COUNT=$(cat final_message_parts_count.txt)
                echo "Found $PARTS_COUNT message parts, posting parts 2 through $PARTS_COUNT"
                for i in $(seq 2 "$PARTS_COUNT"); do
                  PART_FILE="final_message_part_${i}.txt"
                  if [ -f "$PART_FILE" ]; then
                    echo "Posting part $i..."
                    gh issue comment "${{ github.event.issue.number }}" \
                      --body-file "$PART_FILE" \
                      --repo "${{ github.repository }}"
                  else
                    echo "Warning: $PART_FILE not found, skipping"
                  fi
                done
              env:
                GH_TOKEN: ${{ secrets.GH_PAT }}

            - name: Upload logs as artifact
              uses: actions/upload-artifact@v4
              if: always() && env.SKIP_AGENT == 'false'
              with:
                  name: openhands-task-logs
                  path: |
                      *.log
                      output/
                  retention-days: 7

    summarize-metrics:
        runs-on: self-hosted
        if: |
          github.event_name == 'issues' &&
          github.event.action == 'closed' &&
          github.event.issue.pull_request == null
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Check if git-flow-ai cache is needed
              id: check_gfa
              run: |
                if [ ! -d ".git-flow-ai-cache/.github/scripts" ]; then
                  echo "needed=true" >> $GITHUB_OUTPUT
                fi

            - name: Checkout git-flow-ai repo (reusable workflow mode)
              if: steps.check_gfa.outputs.needed == 'true'
              uses: actions/checkout@v5
              with:
                repository: olivier-norture/git-flow-ai
                path: .git-flow-ai-cache
                token: ${{ secrets.GH_PAT }}

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Summarize agent metrics
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
              run: |
                if [ -f ".git-flow-ai-cache/.github/scripts/summarize_metrics.py" ]; then
                  SCRIPT_PATH=".git-flow-ai-cache/.github/scripts/summarize_metrics.py"
                else
                  SCRIPT_PATH=".github/scripts/summarize_metrics.py"
                fi
                python "$SCRIPT_PATH"
