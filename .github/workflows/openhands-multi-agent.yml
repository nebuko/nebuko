name: OpenHands Multi-Agent Router

on:
  issues:
    types: [opened, edited, assigned]
  issue_comment:
    types: [created]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    run-task:
        runs-on: ubuntu-24.04
        if: |
            contains(github.event.comment.body, '@genius') || 
            contains(github.event.comment.body, '@dev')
        env:
            AGENT_SCRIPT_URL: https://raw.githubusercontent.com/OpenHands/agent-sdk/main/examples/03_github_workflows/01_basic_action/agent_script.py
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install OpenHands dependencies
              run: |
                  # Install OpenHands SDK and tools from git repository
                  uv pip install --system "openhands-sdk @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-sdk"
                  uv pip install --system "openhands-tools @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-tools"

            - name: Resolve Agent Configuration
              run: |
                if [[ "${{ github.event.comment.body }}" == *"@genius"* ]]; then
                    echo "PROMPT_LOCATION=.agents/prompts/genius.md" >> $GITHUB_ENV
                    echo "LLM_MODEL=openrouter/deepseek/deepseek-v4-flash" >> $GITHUB_ENV
                    echo "ROLE_NAME=genius" >> $GITHUB_ENV
                elif [[ "${{ github.event.comment.body }}" == *"@dev"* ]]; then
                    echo "PROMPT_LOCATION=.agents/prompts/dev.md" >> $GITHUB_ENV
                    echo "LLM_MODEL=openrouter/deepseek/deepseek-v4-flash" >> $GITHUB_ENV
                    echo "ROLE_NAME=dev" >> $GITHUB_ENV
                fi
            
            - name: Inject GitHub Context into Template
              run: |
                EVENT_PATH="/home/runner/work/_temp/_github_workflow/event.json"
                
                ISSUE_TITLE=$(jq -r '.issue.title' $EVENT_PATH)
                ISSUE_BODY=$(jq -r '.issue.body' $EVENT_PATH)
                TRIGGER_COMMENT=$(jq -r '.comment.body' $EVENT_PATH)
                COMMENT_AUTHOR=$(jq -r '.comment.user.login' $EVENT_PATH)
                
                cp .agents/templates/issue_context.md /tmp/ready_prompt.md
                
                python3 -c "
                import os
                with open('/tmp/ready_prompt.md', 'r') as f: text = f.read()
                text = text.replace('{{ISSUE_TITLE}}', '''$ISSUE_TITLE''')
                text = text.replace('{{ISSUE_BODY}}', '''$ISSUE_BODY''')
                text = text.replace('{{TRIGGER_COMMENT}}', '''$TRIGGER_COMMENT''')
                text = text.replace('{{COMMENT_AUTHOR}}', '''$COMMENT_AUTHOR''')
                with open('/tmp/ready_prompt.md', 'w') as f: f.write(text)
                "
                
                echo "AGENT_QUERY_PATH=/tmp/ready_prompt.md" >> $GITHUB_ENV

            - name: Run OpenHands Agent
              id: openhands_agent
              env:
                LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                LLM_BASE_URL: 'https://openrouter.ai/api/v1/chat/completions'
              run: |
                echo "Running agent as [@$ROLE_NAME] using prompt: $PROMPT_LOCATION"
                if [[ "$AGENT_SCRIPT_URL" =~ ^https?:// ]]; then
                  curl -sSL "$AGENT_SCRIPT_URL" -o /tmp/agent_script.py
                    AGENT_SCRIPT_PATH="/tmp/agent_script.py"
                else
                    AGENT_SCRIPT_PATH="$AGENT_SCRIPT_URL"
                fi

                AGENT_QUERY=$(cat $AGENT_QUERY_PATH)
                uv run python "$AGENT_SCRIPT_PATH" "$PROMPT_LOCATION" "$AGENT_QUERY" | tee console.log

            - name: Clean and Prepare Comment
              if: always() && steps.openhands_agent.outcome == 'success'
              shell: python
              run: |
                import re
                import os

                with open("console.log", "r", encoding="utf-8") as f:
                    content = f.read()

                # On découpe le log à chaque occurrence de "Message from Agent"
                blocks = content.split("Message from Agent ─────────────────────────────────────────────────────────────")
                
                if len(blocks) > 1:
                    # On prend le dernier bloc et on nettoie les scories techniques de fin de log
                    last_message = blocks[-1].split("Tokens:")[0].strip()
                    
                    # Nettoyage des logs JSON parasites d'OpenHands
                    last_message = re.sub(r'{"asctime":.*"message": "Task completed successfully"}', '', last_message).strip()
                    
                    with open("github_comment.md", "w", encoding="utf-8") as f_out:
                        f_out.write(last_message)
                    
                    with open(os.environ['GITHUB_ENV'], 'a') as ge:
                        ge.write("HAS_COMMENT=true\n")
                else:
                    with open(os.environ['GITHUB_ENV'], 'a') as ge:
                        ge.write("HAS_COMMENT=false\n")

            - name: Post Agent Comment to GitHub
              if: always() && env.HAS_COMMENT == 'true'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ github.event.issue.number }}
                body-path: ./github_comment.md

            - name: Upload logs as artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: openhands-task-logs
                  path: |
                      *.log
                      output/
                  retention-days: 7