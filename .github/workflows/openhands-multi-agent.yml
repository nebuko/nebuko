name: OpenHands Multi-Agent Router

on:
  issue_comment:
    types: [created]

jobs:
  route-agent:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.comment.body, '@genius') || 
      contains(github.event.comment.body, '@dev')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Genius Agent
        if: contains(github.event.comment.body, '@genius')
        uses: OpenHands/extensions/plugins/issue-resolver@main
        with:
          llm-model: 'openrouter/deepseek/deepseek-v4-pro'
          llm-base-url: 'https://openrouter.ai/api/v1/chat/completions'
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          instruction-file: '.agents/prompts/genius.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dev Agent
        if: contains(github.event.comment.body, '@dev')
        uses: OpenHands/extensions/plugins/issue-resolver@main
        with:
          llm-model: 'openrouter/qwen/qwen3.6-27b'
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          llm-base-url: 'https://openrouter.ai/api/v1/chat/completions'
          instruction-file: '.agents/prompts/dev.md'
          github-token: ${{ secrets.GITHUB_TOKEN }}