name: OpenHands Multi-Agent Router

on:
  workflow_call:
    inputs:
      genius_model:
        description: 'Model for genius agent'
        required: false
        type: string
        default: 'openrouter/deepseek/deepseek-v4-pro'
      dev_model_low:
        description: 'Model for dev agent (low complexity)'
        required: false
        type: string
        default: 'vllm/cyankiwi/Qwen3.6-27B-AWQ-INT4'
      dev_model_medium:
        description: 'Model for dev agent (medium complexity)'
        required: false
        type: string
        default: 'vllm/cyankiwi/Qwen3.6-27B-AWQ-INT4'
      dev_model_high:
        description: 'Model for dev agent (high complexity)'
        required: false
        type: string
        default: 'vllm/cyankiwi/Qwen3.6-27B-AWQ-INT4'
      ctx_model:
        description: 'Model for ctx agent'
        required: false
        type: string
        default: 'hosted_vllm/qwen-3-6-27b'
      genius_temperature:
        description: 'Temperature for genius agent'
        required: false
        type: number
        default: 0.2
      dev_temperature:
        description: 'Temperature for dev agent'
        required: false
        type: number
        default: 0.0
      llm_seed:
        description: 'Seed for LLM'
        required: false
        type: number
        default: 42
      api_base_url:
        description: 'Base URL for LLM API'
        required: false
        type: string
        default: 'https://openrouter.ai/api/v1/chat/completions'
      genius_base_url:
        description: 'Base URL override for genius model'
        required: false
        type: string
        default: ''
      dev_model_low_base_url:
        description: 'Base URL override for dev low-complexity model'
        required: false
        type: string
        default: 'http://192.168.1.64:31728/v1/chat/completions'
      dev_model_medium_base_url:
        description: 'Base URL override for dev medium-complexity model'
        required: false
        type: string
        default: 'http://192.168.1.64:31728/v1/chat/completions'
      dev_model_high_base_url:
        description: 'Base URL override for dev high-complexity model'
        required: false
        type: string
        default: 'http://192.168.1.64:31728/v1/chat/completions'
      ctx_base_url:
        description: 'Base URL override for ctx model'
        required: false
        type: string
        default: 'http://192.168.1.64:32202/v1/chat/completions'
      circuit_breaker_threshold:
        description: 'Circuit breaker threshold'
        required: false
        type: number
        default: 15
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.13'
      enable_uv_cache:
        description: 'Enable uv cache'
        required: false
        type: boolean
        default: true
      prompt_body:
        description: 'The prompt/body text for the agent to process (required for external callers)'
        required: false
        type: string
        default: ''
    secrets:
      OPENROUTER_API_KEY:
        description: 'Default API key for the LLM provider (used as fallback)'
        required: true
      GENIUS_API_KEY:
        description: 'API key override for the Genius agent'
        required: false
      DEV_MODEL_LOW_API_KEY:
        description: 'API key override for low-complexity dev tasks'
        required: false
      DEV_MODEL_MEDIUM_API_KEY:
        description: 'API key override for medium-complexity dev tasks'
        required: false
      DEV_MODEL_HIGH_API_KEY:
        description: 'API key override for high-complexity dev tasks'
        required: false
      CTX_API_KEY:
        description: 'API key override for the Ctx agent'
        required: false
      GH_PAT:
        description: 'GitHub Personal Access Token for API access'
        required: true
  issues:
    types: [opened, edited, assigned, closed]
  issue_comment:
    types: [created]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    run-task:
        runs-on: self-hosted
        if: |
          github.event.action != 'closed' &&
          (
            github.event_name == 'workflow_call' ||
            (github.event_name == 'issues' &&
             (contains(github.event.issue.body, '@@genius') ||
              contains(github.event.issue.body, '@@ctx') ||
              contains(github.event.issue.body, '@@dev'))) ||
            (github.event_name == 'issue_comment' &&
             (contains(github.event.comment.body, '@@genius') ||
              contains(github.event.comment.body, '@@ctx') ||
              contains(github.event.comment.body, '@@dev')))
          )
        env:
            GENIUS_MODEL: ${{ inputs.genius_model || 'openrouter/deepseek/deepseek-v4-pro' }}
            DEV_MODEL_LOW: ${{ inputs.dev_model_low || 'openai/qwen-3-6-27b' }}
            DEV_MODEL_MEDIUM: ${{ inputs.dev_model_medium || 'openai/qwen-3-6-27b' }}
            DEV_MODEL_HIGH: ${{ inputs.dev_model_high || 'openai/qwen-3-6-27b' }}
            CTX_MODEL: ${{ inputs.ctx_model || 'openai/qwen-3-6-30b-a3b' }}
            GENIUS_TEMPERATURE: ${{ inputs.genius_temperature || 0.2 }}
            DEV_TEMPERATURE: ${{ inputs.dev_temperature || 0.0 }}
            LLM_SEED_OVERRIDE: ${{ inputs.llm_seed || 42 }}
            API_BASE_URL: ${{ inputs.api_base_url || 'https://openrouter.ai/api/v1/chat/completions' }}
            CIRCUIT_BREAKER_THRESHOLD: ${{ inputs.circuit_breaker_threshold || 15 }}
            PYTHON_VERSION: ${{ inputs.python_version || '3.13' }}
            ENABLE_UV_CACHE: ${{ inputs.enable_uv_cache != false }}
            AGENT_SCRIPT_URL: .github/scripts/agent_script.py
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Check if git-flow-ai checkout is needed
              id: check_gfa
              shell: bash
              run: |
                if [ -f ".agents/prompts/genius.md" ]; then
                  echo "needed=false" >> $GITHUB_OUTPUT
                else
                  echo "needed=true" >> $GITHUB_OUTPUT
                fi

            - name: Checkout git-flow-ai repo (reusable workflow mode)
              if: steps.check_gfa.outputs.needed == 'true'
              uses: actions/checkout@v5
              with:
                repository: olivier-norture/git-flow-ai
                path: .git-flow-ai-cache
                token: ${{ secrets.GH_PAT }}

            - name: Normalize GitHub Event Data
              run: |
                EVENT_PATH="$GITHUB_EVENT_PATH"
                
                # Normalize based on event type
                if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
                  TARGET_NUMBER="${{ github.event.issue.number }}"
                  TRIGGER_BODY=$(jq -r '.comment.body // ""' "$EVENT_PATH")
                  TRIGGER_AUTHOR=$(jq -r '.comment.user.login // ""' "$EVENT_PATH")
                  EVENT_TYPE="issue_comment"
                elif [[ "${{ github.event_name }}" == "issues" ]]; then
                  TARGET_NUMBER="${{ github.event.issue.number }}"
                  TRIGGER_BODY=$(jq -r '.issue.body // ""' "$EVENT_PATH")
                  TRIGGER_AUTHOR=$(jq -r '.issue.user.login // ""' "$EVENT_PATH")
                  EVENT_TYPE="issues"
                elif [[ "${{ github.event_name }}" == "workflow_call" ]]; then
                  TARGET_NUMBER=0
                  TRIGGER_BODY="${{ inputs.prompt_body }}"
                  TRIGGER_AUTHOR="${{ github.triggering_actor || github.actor }}"
                  EVENT_TYPE="workflow_call"
                else
                  echo "Unknown event type: ${{ github.event_name }}"
                  exit 1
                fi

                # Use a custom delimiter to handle multi-line strings
                {
                  echo "TRIGGER_BODY<<EOF"
                  echo "$TRIGGER_BODY"
                  echo "EOF"
                } >> "$GITHUB_ENV"

                # Simple variables can remain as is, provided they contain no newlines
                echo "TARGET_NUMBER=$TARGET_NUMBER" >> $GITHUB_ENV
                echo "TRIGGER_AUTHOR=$TRIGGER_AUTHOR" >> $GITHUB_ENV
                echo "EVENT_TYPE=$EVENT_TYPE" >> $GITHUB_ENV
                echo "Normalized event: $EVENT_TYPE -> TARGET_NUMBER=$TARGET_NUMBER"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "${{ env.PYTHON_VERSION || '3.13' }}"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: ${{ env.ENABLE_UV_CACHE != 'false' }}

            - name: Install OpenHands dependencies
              run: |
                  # Install OpenHands SDK and tools from git repository
                  uv pip install --system "openhands-sdk @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-sdk"
                  uv pip install --system "openhands-tools @ git+https://github.com/OpenHands/agent-sdk.git@main#subdirectory=openhands-tools"

            - name: Resolve Agent Configuration
              run: |
                  echo "Debug: Checking trigger body..."
                  # Last-mention-wins: avoids @@ctx stealing execution when mentioned in passing
                  LAST_AGENT=$(echo "$TRIGGER_BODY" | grep -o '@@genius\|@@ctx\|@@dev' | tail -1)

                  # Determine prompt and script locations by checking which path exists
                  if [ -d "$GITHUB_WORKSPACE/.git-flow-ai-cache/.agents/prompts" ]; then
                    PROMPT_BASE="$GITHUB_WORKSPACE/.git-flow-ai-cache/.agents/prompts"
                    echo "AGENT_SCRIPT_URL=$GITHUB_WORKSPACE/.git-flow-ai-cache/.github/scripts/agent_script.py" >> $GITHUB_ENV
                  else
                    PROMPT_BASE=".agents/prompts"
                    echo "AGENT_SCRIPT_URL=.github/scripts/agent_script.py" >> $GITHUB_ENV
                  fi

                  case "$LAST_AGENT" in
                      "@@genius")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/genius.md" >> $GITHUB_ENV
                          echo "LLM_MODEL=${GENIUS_MODEL}" >> $GITHUB_ENV
                          echo "LLM_TEMPERATURE=${GENIUS_TEMPERATURE:-0.2}" >> $GITHUB_ENV
                          echo "LLM_SEED=${LLM_SEED_OVERRIDE:-42}" >> $GITHUB_ENV
                          echo "ROLE_NAME=genius" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          echo "LLM_BASE_URL=${GENIUS_BASE_URL}" >> $GITHUB_ENV
                          echo "LLM_API_KEY=${GENIUS_API_KEY}" >> $GITHUB_ENV
                          ;;
                      "@@ctx")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/ctx.md" >> $GITHUB_ENV
                          echo "LLM_MODEL=${CTX_MODEL}" >> $GITHUB_ENV
                          echo "ROLE_NAME=ctx" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV
                          echo "COMPLEXITY=N/A" >> $GITHUB_ENV
                          echo "LLM_BASE_URL=${CTX_BASE_URL}" >> $GITHUB_ENV
                          echo "LLM_API_KEY=${CTX_API_KEY}" >> $GITHUB_ENV
                          ;;
                      "@@dev")
                          echo "PROMPT_LOCATION=$PROMPT_BASE/dev.md" >> $GITHUB_ENV
                          echo "LLM_TEMPERATURE=${DEV_TEMPERATURE:-0.0}" >> $GITHUB_ENV
                          echo "LLM_SEED=${LLM_SEED_OVERRIDE:-42}" >> $GITHUB_ENV
                          echo "ROLE_NAME=dev" >> $GITHUB_ENV
                          echo "AGENT_SELECTED=true" >> $GITHUB_ENV

                          # Parse complexity from the triggering comment (estimated by @genius)
                          COMPLEXITY_JSON=$(echo "$TRIGGER_BODY" | grep -oP '\{"complexity"\s*:\s*"\w+"\}' || echo '{"complexity": "medium"}')
                          COMPLEXITY=$(echo "$COMPLEXITY_JSON" | jq -r '.complexity' | tr '[:upper:]' '[:lower:]')
                          case "$COMPLEXITY" in
                              "low")
                                  DEV_MODEL="${DEV_MODEL_LOW}"
                                  ;;
                              "high")
                                  DEV_MODEL="${DEV_MODEL_HIGH}"
                                  ;;
                              *)
                                  DEV_MODEL="${DEV_MODEL_MEDIUM}"
                                  ;;
                          esac
                          echo "LLM_MODEL=$DEV_MODEL" >> $GITHUB_ENV
                          echo "COMPLEXITY=$COMPLEXITY" >> $GITHUB_ENV
                          echo "Dev complexity estimated: $COMPLEXITY -> using model: $DEV_MODEL"

                          # Resolve per-complexity base URL
                          case "$COMPLEXITY" in
                              "low")
                                  echo "LLM_BASE_URL=${DEV_MODEL_LOW_BASE_URL}" >> $GITHUB_ENV
                                  ;;
                              "high")
                                  echo "LLM_BASE_URL=${DEV_MODEL_HIGH_BASE_URL}" >> $GITHUB_ENV
                                  ;;
                              *)
                                  echo "LLM_BASE_URL=${DEV_MODEL_MEDIUM_BASE_URL}" >> $GITHUB_ENV
                                  ;;
                          esac

                          # Resolve per-complexity API key
                          case "$COMPLEXITY" in
                              "low")
                                  echo "LLM_API_KEY=${DEV_MODEL_LOW_API_KEY}" >> $GITHUB_ENV
                                  ;;
                              "high")
                                  echo "LLM_API_KEY=${DEV_MODEL_HIGH_API_KEY}" >> $GITHUB_ENV
                                  ;;
                              *)
                                  echo "LLM_API_KEY=${DEV_MODEL_MEDIUM_API_KEY}" >> $GITHUB_ENV
                                  ;;
                          esac
                          ;;
                  esac

                  # Safety guard: skip if no valid agent was resolved
                  if [ -z "$ROLE_NAME" ]; then
                    echo "No valid agent found in trigger body. Skipping."
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    exit 0
                  fi

                  echo "LAST_AGENT=$LAST_AGENT" >> $GITHUB_ENV

            - name: Prevent all agent-trigger loops & human ping guard
              run: |
                  # Guard 1: Block same-agent loops, allow cross-agent calls
                  CALLER_AGENT=$(echo "$TRIGGER_BODY" | sed -n 's/.*<!-- bot-agent-\([a-z]*\) -->.*/\1/p')
                  if [[ -n "$CALLER_AGENT" ]]; then
                      TARGET_AGENT=$(echo "$LAST_AGENT" | sed 's/^@@//')
                      if [[ "$CALLER_AGENT" == "$TARGET_AGENT" ]]; then
                        echo "Same-agent loop detected ($CALLER_AGENT calling itself). Skipping."
                        echo "SKIP_AGENT=true" >> $GITHUB_ENV
                        exit 0
                      else
                        echo "Cross-agent call ($CALLER_AGENT -> $TARGET_AGENT). Allowing."
                      fi
                  else
                    echo "Event type ${{ env.EVENT_TYPE }} - skipping same-agent loop check (no bot marker expected)"
                  fi

                  # Guard 2: If human is pinged alongside agent, skip (let human orchestrate)
                  HAS_AGENT_PING=$(echo "$TRIGGER_BODY" | grep -c '@@genius\|@@ctx\|@@dev' || true)
                  HAS_HUMAN_PING=$(echo "$TRIGGER_BODY" | grep -o '@[a-zA-Z0-9_-]\+' | grep -vc '@@genius\|@@ctx\|@@dev\|@genius\|@ctx\|@dev' || true)
                  if [[ "$HAS_AGENT_PING" -gt 0 && "$HAS_HUMAN_PING" -gt 0 ]]; then
                    echo "Human ping + agent ping detected. Skipping to let human orchestrate."
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    exit 0
                  fi

                  echo "SKIP_AGENT=false" >> $GITHUB_ENV

            - name: Check Circuit Breaker
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                REPO_NAME="${{ github.repository }}"
                TARGET_NUMBER="${{ env.TARGET_NUMBER }}"
                ISSUE_AUTHOR="${{ env.TRIGGER_AUTHOR }}"
                
                # Fetch all comments on the issue
                COMMENT_HISTORY=$(gh api /repos/$REPO_NAME/issues/$TARGET_NUMBER/comments \
                  --jq '.[] | .body' | tr -d '\r')
                
                # Count bot markers (<!-- bot-agent-)
                BOT_MARKER_COUNT=$(echo "$COMMENT_HISTORY" | grep -c '<!-- bot-agent-' || true)
                AGENT_CALLS=$(( BOT_MARKER_COUNT / 2 ))
                
                echo "Agent calls detected: $AGENT_CALLS (threshold: $CIRCUIT_BREAKER_THRESHOLD)"
                
                if [[ "$AGENT_CALLS" -ge "$CIRCUIT_BREAKER_THRESHOLD" ]]; then
                    echo "CIRCUIT_BREAKER_TRIPPED=true" >> $GITHUB_ENV
                    echo "SKIP_AGENT=true" >> $GITHUB_ENV
                    
                    # Build circuit breaker comment line by line
                    {
                      echo "<!-- bot-agent-genius -->"
                      echo ""
                      echo "🚨 **Circuit Breaker Tripped** — Agent Loop Threshold Reached"
                      echo ""
                      echo "This issue has triggered $AGENT_CALLS agent calls (threshold: $CIRCUIT_BREAKER_THRESHOLD)."
                      echo "Further automated agent execution has been **halted** to prevent an infinite loop."
                      echo ""
                      echo "👉 **Action Required:** @$ISSUE_AUTHOR please review the conversation and decide next steps:"
                      echo "- If the task is complete, close this issue."
                      echo "- If more work is needed, reset the conversation by posting \`@@genius reset\` (or manually close/reopen)."
                      echo ""
                      echo "🔗 [View workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                    } > /tmp/circuit_breaker_comment.md
                    
                    # Post the comment
                    gh api /repos/$REPO_NAME/issues/$TARGET_NUMBER/comments \
                      -f body=@/tmp/circuit_breaker_comment.md
                else
                    echo "CIRCUIT_BREAKER_TRIPPED=false" >> $GITHUB_ENV
                fi

            - name: Post Acknowledgment Comment
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ env.TARGET_NUMBER }}
                token: ${{ secrets.GH_PAT }}
                body: |
                  <!-- bot-agent-${{ env.ROLE_NAME }} -->

                  🤖 **${{ env.ROLE_NAME }} agent started** — processing your request.

                  🔗 [View workflow run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  ⏳ This may take 1–10 minutes. I'll reply here when done.

            - name: Prepare Agent Query Context
              if: env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                ISSUE_TEMPLATE: |
                  # 📰 GITHUB CONTEXT

                  An issue comment was triggered. Please review the details below (including full history) and take appropriate action.

                  ## Issue Author
                  {author}

                  ## Issue Title
                  {title}

                  ## Issue Original Description
                  {body}

                  ---

                  ## Full Comment History
                  {history}
              run: |
                EVENT_PATH="${{ github.event_path }}"
                REPO_NAME="${{ github.repository }}"
                
                ISSUE_NUMBER="${{ env.TARGET_NUMBER }}"
                export ISSUE_TITLE=$(jq -r '.issue.title // "No Title"' "$EVENT_PATH")
                export ISSUE_BODY=$(jq -r '.issue.body // "No Description"' "$EVENT_PATH")
                export ISSUE_AUTHOR=$(jq -r '.issue.user.login // "unknown"' "$EVENT_PATH")
                
                export COMMENT_HISTORY=$(gh api /repos/$REPO_NAME/issues/$ISSUE_NUMBER/comments \
                  --jq '.[] | "### \(.user.login) a écrit :\n\(.body)\n---\n"' | tr -d '\r')
                if [[ -z "$COMMENT_HISTORY" ]]; then
                  export COMMENT_HISTORY="No previous comments"
                fi
                
                # Format and write out using a safe single-line python execution
                python3 -c 'import os; print(os.environ["ISSUE_TEMPLATE"].format(title=os.environ.get("ISSUE_TITLE",""), body=os.environ.get("ISSUE_BODY",""), author=os.environ.get("ISSUE_AUTHOR","unknown"), history=os.environ.get("COMMENT_HISTORY","")))' > /tmp/ready_prompt.md
                
                echo "AGENT_QUERY_PATH=/tmp/ready_prompt.md" >> $GITHUB_ENV

            - name: Configure git to use GH_PAT for workflow file access
              if: env.SKIP_AGENT == 'false'
              run: |
                git config --local --unset http.https://github.com/.extraheader || true
                git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

            - name: Run OpenHands Agent
              if: env.SKIP_AGENT == 'false'
              id: openhands_agent
              timeout-minutes: 30
              env:
                GH_TOKEN: ${{ secrets.GH_PAT }}
                LLM_API_KEY: ${{ env.LLM_API_KEY || secrets.OPENROUTER_API_KEY }}
                LLM_BASE_URL: ${{ env.LLM_BASE_URL || env.API_BASE_URL || 'https://openrouter.ai/api/v1/chat/completions' }}
                COMPLEXITY: ${{ env.COMPLEXITY }}
              run: |
                echo "Running agent as [@$ROLE_NAME] using prompt: $PROMPT_LOCATION"
                if [[ "$AGENT_SCRIPT_URL" =~ ^https?:// ]]; then
                  curl -sSL "$AGENT_SCRIPT_URL" -o /tmp/agent_script.py
                    AGENT_SCRIPT_PATH="/tmp/agent_script.py"
                else
                    AGENT_SCRIPT_PATH="$AGENT_SCRIPT_URL"
                fi

                FINAL_PROMPT_FILE="/tmp/final_prompt.md"
                cat "$PROMPT_LOCATION" > $FINAL_PROMPT_FILE
                echo -e "\n\n--- USER REQUEST / GITHUB CONTEXT ---\n" >> $FINAL_PROMPT_FILE
                cat $AGENT_QUERY_PATH >> $FINAL_PROMPT_FILE
                # 2. Maintenant on ne passe qu'un seul argument au script !
                # 2>&1 fusionne stderr dans stdout, stdbuf désactive le buffering pour une écriture immédiate
                stdbuf -oL -eL uv run python "$AGENT_SCRIPT_PATH" "$FINAL_PROMPT_FILE" 2>&1 | tee console.log

            - name: Clean and Prepare Comment
              if: always() && env.SKIP_AGENT == 'false'
              shell: python
              run: |
                import re
                import os
                import logging

                logging.basicConfig(level=logging.INFO)
                logger = logging.getLogger(__name__)

                # Path A: Check for structured final message file
                if os.path.isfile("final_message.txt") and os.path.getsize("final_message.txt") > 0:
                    with open("final_message.txt", "r", encoding="utf-8") as f:
                        content = f.read().strip()

                    # Check for sentinel indicating no final message was extracted
                    if content.startswith("__NO_FINAL_MESSAGE__"):
                        logger.warning("No final message from agent (sentinel detected), falling back to console.log")
                        # Extract and preserve the metrics comment from the sentinel file
                        metrics_match = re.search(r'<!-- agent-metrics:.*?-->', content)
                        metrics_comment = metrics_match.group(0) if metrics_match else ""
                    else:
                        metrics_match = re.search(r'<!-- agent-metrics:.*?-->', content)
                        metrics_comment = metrics_match.group(0) if metrics_match else ""
                        content = re.sub(r'\n?\n?<!-- agent-metrics:.*?-->', '', content).strip()

                        if content:
                            logger.info(f"Using final_message.txt ({len(content)} characters)")
                            # Safety truncation (should already be truncated by agent_script.py)
                            if len(content) > 60000:
                                content = content[:60000] + "\n\n...*(comment truncated due to size limit)*"

                            # Re-add metrics comment if present
                            if metrics_comment:
                                content += "\n\n" + metrics_comment

                            with open("github_comment.md", "w", encoding="utf-8") as f_out:
                                f_out.write(content)
                            with open(os.environ['GITHUB_ENV'], 'a') as ge:
                                ge.write("HAS_COMMENT=true\n")
                            exit(0)
                        else:
                            logger.warning("final_message.txt has no meaningful content, falling back to console.log")
                            # We have metrics_comment preserved from above

                    # Path B: Fallback to console.log parsing (final_message.txt was empty/sentinel)
                    if os.path.isfile("console.log") and os.path.getsize("console.log") > 0:
                        with open("console.log", "r", encoding="utf-8") as f:
                            log_content = f.read()

                        # Try to find the last "Message from Agent" block
                        blocks = log_content.split("Message from Agent ─────────────────────────────────────────────────────────────")

                        if len(blocks) > 1:
                            last_message = blocks[-1].split("Tokens:")[0].strip()
                            last_message = re.sub(r'{"asctime":.*"message": "Task completed successfully"}', '', last_message).strip()
                        else:
                            # Fallback: take last 50 meaningful lines (reduced from 200)
                            lines = log_content.strip().split('\n')
                            # Filter out pure JSON log lines
                            meaningful_lines = [l for l in lines if not re.match(r'^\s*\{', l)]
                            last_message = '\n'.join(meaningful_lines[-50:]) if meaningful_lines else '\n'.join(lines[-50:])

                        # Truncate at paragraph boundary if needed
                        if len(last_message) > 60000:
                            last_message = last_message[:60000]
                            last_break = last_message.rfind("\n\n")
                            if last_break > 30000:
                                last_message = last_message[:last_break]
                            last_message += "\n\n...*(comment truncated due to size limit)*"

                        if not last_message.strip():
                            last_message = "> ⚠️ The agent crashed or produced no readable output. Please check the full logs in the workflow run."

                        # Re-add metrics comment if we preserved one from the sentinel
                        if metrics_comment:
                            last_message += "\n\n" + metrics_comment

                        with open("github_comment.md", "w", encoding="utf-8") as f_out:
                            f_out.write(last_message)
                        with open(os.environ['GITHUB_ENV'], 'a') as ge:
                            ge.write("HAS_COMMENT=true\n")
                        exit(0)

                    # Path C: No console.log either - agent likely crashed before producing output
                    fallback = "> ⚠️ The agent crashed or timed out before producing output. Please check the full logs in the workflow run."
                    if metrics_comment:
                        fallback += "\n\n" + metrics_comment
                    with open("github_comment.md", "w", encoding="utf-8") as f_out:
                        f_out.write(fallback)
                    with open(os.environ['GITHUB_ENV'], 'a') as ge:
                        ge.write("HAS_COMMENT=true\n")
                    exit(0)

                # Path D: final_message.txt doesn't exist at all (agent script didn't run)
                fallback = "> ⚠️ The agent did not produce a final message. Please check the full logs in the workflow run."
                with open("github_comment.md", "w", encoding="utf-8") as f_out:
                    f_out.write(fallback)
                with open(os.environ['GITHUB_ENV'], 'a') as ge:
                    ge.write("HAS_COMMENT=true\n")

            - name: Add bot marker to comment
              if: always() && env.SKIP_AGENT == 'false'
              shell: python
              run: |
                import os
                role = os.environ.get("ROLE_NAME", "unknown")
                marker = f"<!-- bot-agent-{role} -->"
                agent_display_names = {"genius": "Genius", "ctx": "Ctx", "dev": "Developer"}
                display_name = agent_display_names.get(role, role.capitalize())
                with open("github_comment.md", "r") as f:
                    content = f.read()
                with open("github_comment.md", "w") as f:
                    f.write(marker + "\n*" + display_name + " answer*\n\n" + content)

            - name: Post Agent Comment to GitHub
              if: always() && env.HAS_COMMENT == 'true' && env.SKIP_AGENT == 'false' && env.TARGET_NUMBER != '0'
              uses: peter-evans/create-or-update-comment@v4
              with:
                issue-number: ${{ env.TARGET_NUMBER }}
                body-path: ./github_comment.md
                token: ${{ secrets.GH_PAT }}

            - name: Upload logs as artifact
              uses: actions/upload-artifact@v4
              if: always() && env.SKIP_AGENT == 'false'
              with:
                  name: openhands-task-logs
                  path: |
                      *.log
                      output/
                  retention-days: 7

    summarize-metrics:
        runs-on: self-hosted
        if: |
          github.event_name == 'issues' &&
          github.event.action == 'closed' &&
          github.event.issue.pull_request == null
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Summarize agent metrics
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
              run: python .github/scripts/summarize_metrics.py