name: Nebuko on comments

on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    # Fail-closed caller gate (issue #1024): a denied comment never starts a
    # run, so the reusable workflow and its secrets are never invoked. The
    # bot's own comments are excluded as a cheap anti-loop guard on top of the
    # body markers checked inside the reusable workflow.
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login != 'nebuko[bot]' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login != 'nebuko[bot]' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.issue.author_association))
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@main
    with:
      agent_config_path: ".nebuko/agents/agent-config-mistral.yaml"
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      CHEAPERINFERENCE_API_KEY: ${{ secrets. CHEAPERINFERENCE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
