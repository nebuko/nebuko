name: AI Dev Workflow

on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    uses: ./.github/workflows/nebuko-workflow.yaml
    with:
      runs_on: "self-hosted"
      agent_config_path: "defaults/agent-config-commandcode.yaml"
      circuit_breaker_threshold: 25
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
