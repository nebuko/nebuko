name: AI Dev Workflow

on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@main
    with:
      runs_on: "self-hosted"
      agent_config_path: "defaults/agents/agent-config-opencode.yaml"
      circuit_breaker_threshold: 25
      # Secret slots (issue #834): pair a bare secret with the env var name the
      # MCP expects. Add a repo secret + two lines here, never edit the reusable
      # workflow.
      EXTRA_SECRET_1_NAME: "BRAVE_API_KEY"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN }}
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      EXTRA_SECRET_1_VALUE: ${{ secrets.BRAVE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
