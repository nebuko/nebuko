name: AI Dev Workflow (git-flow-ai)

on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    uses: olivier-norture/git-flow-ai/.github/workflows/openhands-multi-agent.yml@main
    with:
      runs_on: "self-hosted"
      agent_config_path: "agent-config.yaml"
      circuit_breaker_threshold: 25
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LOCAL_VLLM_API_TOKEN: ${{ secrets.LOCAL_VLLM_API_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
