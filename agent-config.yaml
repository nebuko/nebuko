# ── Providers: API endpoints + auth ──
providers:
  openrouter:
    api_url: "https://openrouter.ai/api/v1/chat/completions"
    api_token_env: "OPENROUTER_API_KEY"
  local_vllm:
    api_url: "http://192.168.1.64:31728/v1"
    api_token_env: "LOCAL_VLLM_API_TOKEN"

# ── LLMs: model paths referencing providers ──
llms:
  deepseek-v4-pro:
    model_path: "openrouter/deepseek/deepseek-v4-pro"
    provider: "${providers.openrouter}"
    default_temperature: 0.2
    input_price: 2.0
    output_price: 8.0

  deepseek-v4-flash:
    model_path: "openrouter/deepseek/deepseek-v4-flash"
    provider: "${providers.openrouter}"
    default_temperature: 0.0
    input_price: 0.12
    output_price: 0.18

  qwen-3-6-30b:
    model_path: "hosted_vllm/qwen-3-6-30b-a3b"
    provider: "${providers.local_vllm}"
    default_temperature: 1.0
    input_price: 0.35
    output_price: 0.40
    thinking_enabled: true
    preserve_thinking: true
    max_output_tokens: 32768
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0

  qwen-3-6-27b:
    model_path: "hosted_vllm/qwen-3-6-27b"
    provider: "${providers.local_vllm}"
    default_temperature: 0.7
    input_price: 0.35
    output_price: 0.40
    thinking_enabled: true
    preserve_thinking: true
    max_output_tokens: 32768
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0

# ── Agents: role → model + prompt + skills + tools ──
# Tools: terminal, file_editor, task_tracker (SDK tools)
#        think, finish (built-in defaults)
agents:
  genius:
    model: "${llms.qwen-3-6-27b}"
    temperature: 1.0
    prompt_file: ".agents/prompts/genius.md"
    skills: []
    tools: ["think", "finish"]

  dev:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/dev.md"
    skills: []
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish"]

  ctx:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/ctx.md"
    skills: []
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish"]

  review:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/review.md"
    skills: []
    tools: ["think", "finish"]

  issue:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/issue.md"
    skills: []
    tools: ["think", "finish"]

  issue-reviewer:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/issue-reviewer.md"
    skills: []
    tools: ["think", "finish"]

  summarize:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/summarize.md"
    skills: []
    tools: ["think", "finish"]

  debug:
    model: "${llms.qwen-3-6-27b}"
    prompt_file: ".agents/prompts/debug.md"
    skills: []
    tools: ["terminal", "file_editor", "think", "finish"]
