# Default workflow with the declared step-output format (issue #973).
#
# A copy of `defaults/workflows/default.yaml` where the report-posting steps
# declare an `output:` shape: the agent writes its report as section bodies
# between the engine's markers and ends with the terminal `finalize` tool
# carrying the routing decision. The engine renders the posted comment.
#
# `context` deliberately declares no output: its comment is the free-form data
# payload downstream steps consume, not a report.

name: default-with-output
description: "Standard development workflow with declared step outputs: analyze → context → plan → implement → review"

steps:
  - name: analyze
    agent: architect
    complexity: low
    prompt: |
      Analysis turn: a human issue or request just arrived.
      - Decide what context @@context must collect (files, docs, facts).
      - Estimate complexity: `high` for architectural changes or many subsystems, `low` for a narrow change, otherwise omit it (@@context defaults to medium).
      - Delegate to @@context in the SAME turn, and end with the typed hand-off:
        finalize(
          report="…this step's report…",
          turn_outcome={
            "appreciation": "approved",
            "complexity": "low",            # optional: omit to inherit the step's
            "agent_call": {"agent_name": "context", "task": "…exact files/facts to collect…"},
          },
        )
        Without turn_outcome.agent_call the hand-off is lost: the engine routes typed calls only.
      - Do not plan yet. The engine's closing turn asks only for this step's report (the context request): the delegate has not run yet, so there is nothing to plan from.
      - A rejected tool call is a call-shape error, not the delegate's answer — fix the call and retry it.
    # The full Planning skill is injected on the role prompt's agent config; on
    # this analysis step it is demoted to a catalog entry so the plan template
    # cannot be mistaken for this step's artifact (issue #1054).
    skill:
      - discover: ["planning"]
    next: context
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the request and the analysis.
        - name: context_request
          collapsed: true
          required: true
          description: What @@context must collect (files, docs, facts). Copy this verbatim into `agent_call.task` of the finalize hand-off.
        - name: assumptions
          required: false
          description: Defaults you will proceed with if context is thin.

  - name: context
    agent: context
    next: plan

  - name: plan
    agent: architect
    prompt: |
      Planning turn: @@context has returned. Follow the Planning skill: emit the single planning artifact (or revise it if your context has a `## Human Gate Decision`), then end with `finalize(turn_outcome={appreciation:'approved', complexity:…})` on the same turn. Never `hold` on this gated step.
    next: implement
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: context
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the plan.
        - name: decision
          description: The chosen approach and the key rulings.
        - name: design
          collapsed: true
          required: false
          description: The Object Design Contract (classes, fields, methods).
        - name: questions
          required: false
          description: Open questions for the human gate.

  - name: implement
    agent: dev
    next: review
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the change.
        - name: changes
          description: What changed, with file paths.
        - name: verification
          required: false
          description: Tests run and their results.

  - name: review
    agent: review
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
    output:
      fields:
        - name: headline
          title: true
          description: One-line verdict summary.
        - name: findings
          description: Review findings, round by round.
        - name: verdict
          required: false
          description: The decision and its justification.
