# Dev-Review Loop Workflow (this repo's override of defaults/workflows/)
#
# The engine produces the diff and test results, so review gets evidence the
# agent didn't write. Each script step runs in its own engine run, on the
# session branch the engine checks out (`checkout: session`, the default).

name: dev-review-loop
description: "Execute a single plan step, then review it with an engine-run diff and test results"

steps:
  - name: implement
    agent: dev
    next: git_diff

  # The stat comes first: output over the size cap loses its middle.
  - name: git_diff
    script:
      command: "sh"
      args:
        - "-c"
        - >-
          git --no-pager diff --stat origin/main...HEAD &&
          git --no-pager diff origin/main...HEAD
    # Default edges: a failed command is evidence for review, not a stop.
    conditions:
      - on_result: default
        next: run_tests

  - name: run_tests
    script:
      command: "sh"
      args:
        - "-c"
        - >-
          uv run --extra runtime pytest tests src/nebuko/engine/lib -q --tb=short -rf
      timeout_minutes: 20
    conditions:
      - on_result: default
        next: review

  - name: review
    agent: review
    inputs: [implement, git_diff, run_tests]
    prompt: |
      `git_diff` and `run_tests` were run by the engine: trust them over any
      claim in `implement`, and check that their `head` matches. A failed
      `run_tests` is a finding, unless the same test also fails on `origin/main`.
      Long output is truncated in the middle, so read the branch for what's cut.

      Engine facts first: if the previous step's context carries an
      `engine_failure` entry, a missing diff or missing commits are an ENGINE
      failure (the run crashed after publishing; the branch was never pushed),
      not agent fabrication — report it as such and do not route it to `plan`;
      ask for the step to be re-run instead.
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
