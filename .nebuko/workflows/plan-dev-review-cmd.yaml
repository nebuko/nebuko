# Default workflow: the standard dev chain
# architect → context → architect (plan) → dev → review

name: plan-dev-review-cmd
description: "Standard development workflow: analyze → context → plan → implement → review"

steps:
  - name: analyze
    agent: architect
    complexity: low
    prompt: |
      Analysis turn: a human issue or request just arrived.
      - Decide what context @@context must collect (files, docs, facts).
      - Estimate complexity: `high` for architectural changes or many subsystems, `low` for a narrow change, otherwise omit it (@@context defaults to medium).
      - Delegate with `dispatch_next(status='advance', complexity=…)` on the same turn as your message. Do not plan yet.
    next: context

  - name: context
    agent: context
    inputs: [analyze]
    next: plan

  - name: plan
    agent: architect
    prompt: |
      Planning turn: @@context has returned. Follow the Planning skill: emit the single planning artifact (or revise it if your context has a `## Human Gate Decision`), then end with `dispatch_next(status='advance', complexity=…)` on the same turn. Never `hold` on this gated step.
    inputs: [context]
    next: implement
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: context

  - name: implement
    agent: dev
    inputs: [plan]
    next: fetch_base

  # The workspace checkout is shallow (actions/checkout default fetch-depth: 1)
  # and pinned to the triggering ref, so the remote-tracking ref `origin/main`
  # does not exist. Fetch it explicitly before diffing; without this the diff
  # dies with `fatal: ambiguous argument 'origin/main'` (issue #957).
  - name: fetch_base
    script:
      path: "git"
      args: ["fetch", "--no-tags", "--depth=50", "origin", "main:refs/remotes/origin/main"]
    next: git_diff

  - name: git_diff
    script:
      path: "git"
      args: ["diff", "origin/main", "HEAD"]
    next: run_tests

  - name: run_tests
    script:
      path: "uv"
      args: ["run", "pytest", "-q", "--tb=no", "-rf"]
    next: review

  - name: review
    agent: review
    inputs: [plan, implement, git_diff, run_tests]
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
