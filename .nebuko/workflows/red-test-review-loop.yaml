# Red-Test Review Loop Workflow
#
# TDD's first half: turn the plan/architecture into the smallest set of failing
# tests that proves the feature is implemented once they pass. Same shape as
# dev-review-loop: the engine produces the diff and test results, so review
# gets evidence the agent didn't write.
#
# Loop: write_tests -> git_diff -> run_tests -> review -> (rejected) write_tests
# A separate implementation run turns these tests green.

name: red-test-review-loop
description: "Write the minimal red tests for the plan (TDD), then review them against the plan with an engine-run diff and test results"

steps:
  - name: write_tests
    agent: dev
    prompt: |
      TDD red step. Write ONLY tests (plus the minimum stubs needed so they
      import) that lock the plan/architecture's expected behaviour. Do NOT
      implement the feature.

      Rules:
      1. Smallest set: the fewest tests that, once green, prove the feature
         works. One test per plan requirement / acceptance criterion; add a
         second only for a distinct failure mode the first cannot catch (an
         error path the plan names). No exhaustive edge-case matrices, no
         tests of existing behaviour.
      2. Test the behaviour through the public interface the plan specifies,
         not internals. A test that would pass against any trivial or empty
         implementation is a defect.
      3. Each test must be RED for the right reason: it fails on its assertion
         or on `NotImplementedError`, never on an import error, fixture error
         or typo. Where a new module/function must exist, add a stub with the
         plan's exact signature whose body is `raise NotImplementedError`
         (mark it `# @stub-protected`).
      4. Follow the repo's test conventions (AGENTS.md): import by package
         path `nebuko.engine.lib.<mod>`, name tests given/when/then, put them
         under `tests/` (or next to the module under `src/nebuko/engine/lib`).
      5. Run the new tests with `uv run --extra runtime pytest <paths>` and
         include the failing output as evidence. Commit and push.

      If this is a retry, the review findings are in your context: fix exactly
      those (missing coverage, vacuous test, wrong-reason failure, extra
      tests to cut) and nothing else.
    skill:
      - stub-only
    next: git_diff

  # The stat comes first: output over the size cap loses its middle.
  - name: git_diff
    script:
      command: "sh"
      args:
        - "-c"
        - >-
          sh .nebuko/scripts/use-session-branch.sh &&
          git --no-pager diff --stat origin/main...HEAD &&
          git --no-pager diff origin/main...HEAD
    # Default edges: a failed command is evidence for review, not a stop.
    conditions:
      - on_result: default
        next: run_tests

  # Red is the EXPECTED result here. Review judges which tests fail and why.
  - name: run_tests
    script:
      command: "sh"
      args:
        - "-c"
        - >-
          sh .nebuko/scripts/use-session-branch.sh &&
          uv run --extra runtime pytest tests src/nebuko/engine/lib -q --tb=short -rf
      timeout_minutes: 20
    conditions:
      - on_result: default
        next: review

  - name: review
    agent: review
    inputs: [write_tests, git_diff, run_tests]
    prompt: |
      You review RED TESTS against the plan. You did not write them. The
      source of truth is the plan/architecture (and the issue it came from),
      not the tests.

      `git_diff` and `run_tests` were run by the engine: trust them over any
      claim in `write_tests`, and check that their `head` matches. Long output
      is truncated in the middle, so read the branch for what's cut.

      Engine facts first: if the previous step's context carries an
      `engine_failure` entry, a missing diff or missing commits are an ENGINE
      failure (the run crashed after publishing; the branch was never pushed),
      not agent fabrication — report it as such and ask for the step to be
      re-run instead of rejecting.

      Failures in `run_tests` are EXPECTED for the new tests. Judge them:
      1. COVERAGE. List each plan requirement / acceptance criterion and the
         test that locks it. Any requirement with no test is a finding.
      2. MINIMALITY. Is every test needed? Flag tests that duplicate another,
         test existing behaviour, or exceed what the plan asks. The target is
         the smallest set that proves the feature once green.
      3. RIGHT-REASON RED. Each new test must fail on its assertion or
         `NotImplementedError`. A new test that passes (vacuous), or errors on
         import/fixture/syntax, is a finding.
      4. PLAN FIDELITY. Stub signatures and public interfaces match the plan
         exactly; no test pins behaviour the plan contradicts; no business logic
         was implemented.
      5. NO COLLATERAL. Any failing test that is NOT one of the new tests is a
         finding, unless it also fails on `origin/main`.

      Approve only when every requirement is covered, the set is minimal, and
      every new test is red for the right reason. Otherwise reject with a
      concrete list: tests to add, tests to cut, tests to fix. Do not write
      the tests yourself.
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: write_tests
