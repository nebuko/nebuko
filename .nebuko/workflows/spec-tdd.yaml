name: spec-tdd
description: "Spec-first TDD: plan → doc + red tests + stubs (human gate on the diff) → implement → review"

steps:
  - name: analyze
    agent: architect
    complexity: low
    prompt: |
      Analysis turn: a human issue or request just arrives. Before writing the
      context request, think (`think` tool) through:
      1. Classify the request:
         - **"find why" / "doesn't match"** (a discrepancy, a failure, a
           reported number that disagrees): skip the ranked claims. List the
           reported deltas (counts, versions, timings, SHAs), then write an
           ordered list of discriminating measurements — cheapest first
           (identifiers/SHAs/versions, then targeted test IDs, a full suite
           last) — and give each one a stop condition ("if the SHA differs,
           stop"). Do not rank hypotheses: a guess from the issue text is
           worth less than one measurement. Set `complexity: low` on the
           hand-off, since a matching measurement ends the investigation.
         - **build vs buy / version / capability / limits / pricing**: sketch
           2–3 candidate approaches, one line each, and continue with steps
           2–5 below.
      2. List the external facts the request depends on (build vs buy,
         versions, capabilities, limits and pricing).
      3. Think in opposites: for the preferred approach, state what you would
         expect to find if it were WRONG, and ask @@context to confirm or refute that.
      4. Keep only claims whose `if_wrong` would actually change the plan
         (max 3 at low complexity, 5 medium, 8 high; at least one third must
         be refuting claims).
      5. Treat every version, price and limit as unverified until @@context
         confirms it from a registry or the vendor's official page.
      6. For performance or runtime-behaviour questions (slow, startup, memory,
         "what runs when"), the context request must ask @@context to MEASURE:
         name the experiment (profiler, timed run, cold vs warm, before/after a
         candidate fix) and ask for the command and its output. A list of files
         to read is not enough: reading code cannot show where time goes.
      - Attach `agent_call.verify` (list of {id: "C1", claim, kind:
        "support"|"refute", category: build_vs_buy|version|capability|
        limits_pricing|alternatives|compatibility, if_wrong}) on the hand-off
        when the request is build-vs-buy / version / capability. For "find
        why" requests, put the ordered measurements and their stop conditions
        in `agent_call.task` instead, and leave `verify` empty.
        Never include the draft plan in the task — the claims are checked
        independently of it.
      - Estimate complexity: `high` for architectural changes or many
        subsystems, `low` for a narrow change or a "find why" request,
        otherwise omit it (@@context defaults to medium).
      - Delegate to @@context in the SAME turn, and end with the typed hand-off:
        finalize(
          report="…this step's report…",
          turn_outcome={
            "appreciation": "approved",
            "complexity": "low",            # optional: omit to inherit the step's
            "agent_call": {"agent_name": "context", "task": "…exact files/facts to collect…", "verify": [{"id": "C1", "claim": "…", "kind": "refute", "category": "version", "if_wrong": "…what changes in the plan…"}]},
          },
        )
        Without turn_outcome.agent_call the hand-off is lost: the engine routes typed calls only.
      - If the request needs more than one PR, scope this run to the first PR and
        list the rest as follow-up issues in your assumptions.
      - Do not plan yet. The engine's closing turn asks only for this step's report in its declared sections: the delegate has not run yet, so there is nothing to plan from.
      - A rejected tool call is a call-shape error, not the delegate's answer — fix the call and retry it.
    next: context
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the request and the analysis.
        - name: approaches
          type: table
          collapsed: true
          required: false
          columns: [approach, dependencies, verdict]
          description: The 2-3 candidate approaches sketched before planning.
        - name: claims
          type: table
          collapsed: true
          required: false
          columns: [id, claim, kind, category, if_wrong]
          description: The verification claims mirroring agent_call.verify, one row per claim.
        - name: context_request
          collapsed: true
          required: true
          description: What @@context must collect (files, docs, facts). Copy this verbatim into `agent_call.task` of the finalize hand-off.
        - name: assumptions
          required: false
          description: Defaults you will proceed with if context is thin.
        - name: requirements
          collapsed: true
          required: true
          description: The requirements ledger (R/K/NG/Q table with source and origin). Every later step references these IDs.

  - name: context
    agent: context
    prompt: |
      Collect what the analyze step's context request (agent_call.task) asks
      for, and return it as this step's report. The claims attached to the hand-off (agent_call.verify)
      are checked independently: cite a source for every claim in your report.
      Follow the context-research Evidence rules: tag every finding and claim
      verdict `measured`, `read` or `inferred`; measure timing and behaviour
      claims instead of inferring them from code; and fill `### MEASUREMENTS`,
      `### SURPRISES` and `### NOT VERIFIED`.
      Measure cheapest first (identifiers/SHAs/versions, then targeted test
      IDs, a full suite last; batch independent long runs and poll once). Stop
      as soon as ONE measured reproduction matches the reported numbers, and
      say which deltas matched under `### WHAT THE MEASUREMENTS SHOW`.
    next: plan

  - name: plan
    agent: architect
    prompt: |
      Planning turn: @@context has returned. Follow the Planning skill: emit the single planning artifact, then end with `finalize(turn_outcome={appreciation:'approved', complexity:…})` on the same turn.
      Downstream is the spec step: your Object Design Contract section is the contract it will materialize 1:1 as stub classes and red tests, so make it complete and exact (file paths, fields with types, every method signature marked `# @stub-protected`). Also state where the user-facing doc goes (existing docs/ dir, or a new file) and what usage/behaviour sections it must contain.
    next: spec
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the plan.
        - name: decision
          description: The chosen approach and the key rulings.
        - name: evidence
          type: table
          collapsed: true
          columns: [fact, type, source, used_by]
          description: Every number and runtime-behaviour fact the decision relies on, one row each. `type` is the context tag (measured/read/inferred); `source` is the command+output excerpt, path:line or URL; `used_by` names the decision item. Only `measured` rows may carry a timing or saving figure. Inferred facts belong in questions, not in the decision.
        - name: design
          collapsed: true
          description: The Object Design Contract (classes, fields, method signatures) — the spec step materializes this 1:1.
        - name: doc_contract
          required: false
          description: Where the doc lives and the sections it must contain (how to use, how it works).
        - name: questions
          required: false
          description: Open questions for the human gate.
        - name: coverage
          required: true
          description: One row per ledger ID → the plan decision/step that covers it and the test or check that will verify it.

  - name: spec
    agent: dev
    prompt_replace: true
    prompt: |
      You are in spec-materialization mode. Convert the approved @@architect plan into
      a reviewable spec diff on a branch. NO business logic — this step's output is
      doc + failing tests + skeleton code only.

      Do, in order:
      1. Write the user-facing doc from the plan's doc contract: how to USE the
         feature (usage) and how it WORKS (mechanics, where it plugs into the
         codebase). No raw spec prose: this doc replaces it.
      2. Write the tests that lock the expected outcome and behaviour (given/when/
         then style names). They are EXPECTED TO FAIL against stubs.
      3. Create the skeleton code exactly as the plan's Object Design Contract
         specifies: fields, method signatures with `# @stub-protected` markers,
         bodies `raise NotImplementedError`. Do not deviate from the contract.
      4. Run the new tests and capture the failure output — this is the RED evidence.
         A test that passes or errors on import is not red: fix it until it fails
         on the assertion/NotImplementedError, then leave it failing.
      5. Commit, push, and open the PR as a DRAFT (or push to the existing PR's
         branch). Title it from the plan headline; body = doc summary + the red
         test list + the contract file paths.
    skill:
      - git-pr-workflow
      - stub-only
    conditions:
      - on_result: approved
        next: critique
      - on_result: rejected
        next: plan
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the spec.
        - name: spec_files
          description: Paths of the doc, the test file(s) and the stub module(s), plus the PR URL.
        - name: red_evidence
          collapsed: true
          description: The failing pytest output proving the tests are red against the stubs.
        - name: contract_fidelity
          required: false
          description: Any deviation from the plan's Object Design Contract, with justification (deviations need the gate's explicit ruling).

  - name: critique
    agent: review
    prompt_replace: true
    prompt: |
      You are the DESIGN CRITIC. You did not write this plan or this spec, and your job is
      not to approve them: it is to find the reasons they will fail, before any business
      logic is written. Be specific and evidence-based; politeness is not a goal.

      Engine facts first: if the previous step's context carries an
      `engine_failure` entry (the engine stamps it when a run crashed after
      publishing), the missing diff you are about to flag may be an ENGINE
      failure, not agent fabrication. Check `pushed`, `branch` and `head_sha`
      there before judging: a run whose branch was never pushed left no diff
      by definition. Report such a case as an engine failure and do NOT route
      it to `plan` — the plan is not the problem. Ask for the step to be
      re-run instead.

      Inputs, in order of authority:
        1. The original issue and the human comments. This is the source of truth.
        2. The requirements ledger (R/K/NG/Q) from the analyze step, if present.
        3. The @@architect plan: decision, Object Design Contract, doc contract.
        4. The spec draft PR: doc, red tests, stubs.
      Treat the plan's reasoning as claims to test, never as evidence. The @@context report
      counts as evidence only where it cites a source.

      Do, in order. You may read code, grep and run commands; you may NOT edit, commit or push.

      1. COVERAGE. List every requirement and constraint from the issue (use the ledger IDs
        when they exist; otherwise extract them yourself as R1…, K1…). For each, name the
        plan step AND the red test that locks it. Report every item with no step or no
        test, and every non-goal the plan violates.

      2. SPEC FIDELITY.
        - The stubs match the Object Design Contract 1:1 (paths, fields, types, signatures,
          `# @stub-protected`).
        - The tests encode the REQUIREMENTS, not just the stub shapes. A test that would
          pass against any trivial implementation is a finding.
        - Run the new tests: each must fail on its assertion or NotImplementedError, not
          on an import or fixture error.
        - Run the project's type checker on the stub modules if one is configured.

      3. SIMPLICITY. Is there a materially simpler design that meets every R and K: fewer
        classes, no new dependency, reuse of existing code in this repo (grep for it), or a
        standard library or well-known package? If so, sketch it in two lines and say which
        requirement, if any, it would fail.

      4. RISKIEST ASSUMPTION. Name the single assumption that, if false, breaks the plan the
        most (library behaviour, version, platform limit, pricing, performance). Say whether
        it was verified, by what source, and whether the decision is one-way (dependency,
        schema, public API, vendor) or two-way.
        Then RE-MEASURE: pick the measured fact the decision leans on most (the plan's
        `evidence` table) and run that measurement yourself. Also run the cheapest check of
        whether the chosen fix actually moves it (e.g. apply it in a scratch copy and time
        again). Report both commands and their output under checks_run.

      5. PRE-MORTEM. Six months from now this feature failed or was reverted. Write the three
        most likely reasons, each tied to a specific section of the plan or file in the spec.

      6. OPERATIONS. Error and failure paths, 10× load or 10× cost, security and secrets
        handling, migration and rollback. Only where relevant to this change.

      Classify every finding:
        - BLOCKING: an uncovered R/K, a violated NG, a contract that is not implementable or
          not type-correct, tests that do not exercise the requirement, an unverified one-way
          assumption that is likely false, or a materially simpler design that meets all R/K.
          Also BLOCKING: a timing/saving figure in the decision with no `measured` evidence
          row, a decision resting on an `inferred` fact, a re-measurement that contradicts
          the plan, or a fix that moves only a metric or shifts the same cost later in the
          run instead of improving the user's outcome.
          Also BLOCKING, unless `engine_failure` explains it: no failing-test output for
          this round's changes. Also BLOCKING: a test that pins behaviour the plan or a
          human ruling says is wrong.
        - SHOULD-FIX: real risk or gap that does not invalidate the plan.
        - NIT: everything else. Keep at most three.
      Each finding states: where (plan section or file:line), what is wrong, why it matters,
      and the DECISION the architect must make. Do not write the fix or redesign the
      feature yourself.

      Round rule: if a previous critique round exists, first check each earlier BLOCKING
      finding (resolved / not resolved). Raise a new BLOCKING finding only for issues
      introduced by the revision or clearly missed before.

      Verdict:
        - Any unresolved BLOCKING finding → finalize(turn_outcome={appreciation:'rejected'})
        - Otherwise → finalize(turn_outcome={appreciation:'approved'})
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: plan
    output:
      fields:
        - name: headline
          title: true
          description: 'One-line verdict, e.g. "2 blocking, 3 should-fix: uncovered K2, test for R1 is vacuous".'
        - name: coverage
          description: Table of every R/K/NG → plan step → red test, with gaps marked.
        - name: blocking
          required: false
          description: BLOCKING findings, each with location, problem, impact and the decision required.
        - name: should_fix
          required: false
          collapsed: true
          description: SHOULD-FIX findings and at most three nits.
        - name: riskiest_assumption
          description: The assumption, whether and how it was verified, and one-way vs two-way.
        - name: premortem
          collapsed: true
          description: Three most likely failure reasons, each tied to a plan section or file.
        - name: checks_run
          collapsed: true
          description: Commands run (tests, type checker, greps) and their key output.

  - name: implement
    agent: dev
    prompt: |
      Implementation turn: the human has approved the spec diff. Fill the stub bodies
      exactly as the Object Design Contract and the red tests dictate; the tests you
      must turn green are already on the branch. You MAY create helpers called only
      from stub bodies; you MAY NOT change any `# @stub-protected` signature, the
      doc, or the test expectations. If a test itself was wrong, stop and escalate to
      @@architect instead of editing the test.
      Verify green with `uv run pytest` on the relevant paths, push, and mark the PR
      ready for review. End with finalize(turn_outcome={appreciation:'approved'}).
    skill:
      - stub-only
    next: review
    output:
      fields:
        - name: headline
          title: true
          description: One-line summary of the change.
        - name: changes
          description: What changed, with file paths.
        - name: verification
          required: false
          description: Tests run and their results (must show the spec tests green).

  - name: review
    agent: review
    prompt: |
      Review turn. Check the engine facts first: if the previous step's context
      carries an `engine_failure` entry, a missing diff or missing commits are an
      ENGINE failure (the run crashed after publishing; the branch was never
      pushed), not agent fabrication — report it as such and do not route it to
      `plan`; ask for the step to be re-run instead.
      Besides the usual review, verify the spec chain: (1) every doc claim
      matches the shipped behaviour; (2) every spec test is green and still exercises
      the contract that was gated; (3) no `# @stub-protected` signature, doc section or
      test expectation was silently changed during implementation.
      Run each requirement through the real code path, not only its tests. Treat these
      as findings: tests using hand-built state the engine never writes, assertions that
      cannot fail (for example `or True`), and a full test suite that did not finish.
      If the contract itself is wrong, finish with appreciation 'hold' and name the
      defect. Do not send it back to implement, which cannot change the contract.
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
    output:
      fields:
        - name: headline
          title: true
          description: One-line verdict summary.
        - name: findings
          description: Review findings, round by round.
        - name: spec_chain
          required: false
          description: Result of the doc/test/signature fidelity check.
        - name: verdict
          required: false
          description: The decision and its justification.
