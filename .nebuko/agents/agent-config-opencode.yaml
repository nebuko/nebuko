# ── Providers: API endpoints + auth ──
# ``opencode_go`` is OpenAI-compatible. It is designed for coding agents and
# expects a stable per-session identity: ``user_agent`` declares the client
# identity and ``session_header`` names the header the engine fills with the
# trigger's issue number at runtime (never a value in this file).
providers:
  opencode_go:
    api_url: "https://opencode.ai/zen/go/v1"
    api_token_env: "OPENCODE_GO_API_KEY"
    user_agent: "nebuko/1.0"
    session_header: "x-opencode-session"
    drop_message_name: true

# ── LLMs: model paths referencing providers ──
llms:
  deepseek-v4_1-flash:
    model_path: "openai/deepseek-v4.1-flash"
    provider: "${providers.opencode_go}"
    preserve_thinking: true
    thinking_enabled: false
    reasoning: "none"
    reasoning_effort: "none"
    top_p: 0.95
  glm-5_3-flash:
    model_path: "openai/glm-5.3-flash"
    provider: "${providers.opencode_go}"
  mimo-2_6-pro:
    model_path: "openai/mimo-v2.6-pro"
    provider: "${providers.opencode_go}"
    thinking_enabled: true
    preserve_thinking: true

# ── MCP servers: reusable catalog, referenced by agents via ${mcp_servers.<name>} ──
mcp_servers:
  brave-search:
    name: "brave-search"
    command: "npx"
    args:
      - "-y"
      - "@brave/brave-search-mcp-server@2.1.4"
      - "--enabled-tools"
      - "brave_web_search"
      - "brave_news_search"
    env:
      BRAVE_API_KEY: "BRAVE_API_KEY"

# ── Agents: role → model + prompt + skills + tools ──
# Tools: terminal, file_editor, task_tracker (SDK tools)
#        think, finish (built-in defaults)
agents:
  architect:
    model: "${llms.mimo-2_6-pro}"
    role: "Principal software engineer — analysis, architecture, planning, and delegation; never writes code."
    temperature: 0.4
    prompt_file: "defaults/prompts/architect.md"
    skills:
      - inject: ["call-agent", "posting-contract", "planning"]
      - discover: ["complexity"]
    tools: ["think", "finish", "dispatch_next", "call_agent", "complexity_review"]
    complexity_overrides:
      low:
        model: "${llms.deepseek-v4_1-flash}"
        thinking_enabled: true
        reasoning: "medium"
      high:
        temperature: 0.6
        reasoning: "high"

  dev:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Implementation engineer — writes code, runs tests, manages branches, commits, and PRs."
    temperature: 0.1
    reasoning: "none"
    reasoning_effort: "none"
    prompt_file: "defaults/prompts/dev.md"
    skills:
      - inject: ["posting-contract"]
      - discover: ["git-pr-workflow", "complexity"]
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish", "dispatch_next", "call_agent", "report_scaffold_branch", "complexity_review"]

  context:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Read-only context collector — gathers and compiles codebase facts for other agents."
    temperature: 0.1
    reasoning: "none"
    reasoning_effort: "none"
    prompt_file: "defaults/prompts/context.md"
    skills:
      - inject: ["call-agent", "posting-contract", "context-research"]
      - discover: ["complexity"]
    tools: ["terminal", "file_editor", "task_tracker", "think", "finish", "dispatch_next", "call_agent", "complexity_review"]
    mcp_servers:
      - "${mcp_servers.brave-search}"

  review:
    model: "${llms.glm-5_3-flash}"
    role: "Code and plan reviewer — reviews PRs and plans round by round and runs retrospectives; never modifies code."
    temperature: 0.4
    prompt_file: "defaults/prompts/review.md"
    skills:
      - inject: ["posting-contract", "plan-review"]
      - discover: ["retrospective", "complexity"]
    tools: ["terminal", "think", "finish", "dispatch_next", "call_agent", "complexity_review"]

  po:
    model: "${llms.deepseek-v4_1-flash}"
    role: "Product owner — triages and refines issues into actionable specs; never modifies code."
    prompt_file: "defaults/prompts/po.md"
    skills:
      - inject: ["call-agent", "posting-contract", "issue-refinement"]
      - discover: ["complexity"]
    tools: ["think", "finish", "dispatch_next", "call_agent", "complexity_review"]
