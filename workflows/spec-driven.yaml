# Spec-Driven Development Workflow
# po → [human spec approval] → genius (architect) → dev (stub) → review → [human stub approval] → dev (implement)

name: spec-driven
description: "Spec-driven development: spec → stub → implement"

trigger:
  agents: [po]  # which @@mentions can start this workflow

steps:
  - name: spec
    agent: po
    next: architect_prepare_ctx
    conditions:
      - on_result: approved
        next: architect_prepare_ctx
      - on_result: rejected
        next: spec

  - name: stub_and_implement
    workflow: spec-driven-impl

