# Spec-Driven Development Workflow
# po → [human spec approval] → genius (architect) → dev (stub) → review → [human stub approval] → dev (implement)

name: spec-driven
description: "Spec-driven development: spec → stub → implement"

trigger:
  agents: [po]  # which @@mentions can start this workflow

steps:
  - name: spec
    agent: po
    next: architect_prepare_ctx
    conditions:
      - on_result: approved
        next: architect_prepare_ctx
      - on_result: rejected
        next: spec

  - name: architect_prepare_ctx
    agent: genius
    next: ctx_architect
  
  - name: ctx_architect
    agent: ctx
    next: architect_review_ctx

  - name: architect_review_ctx
    agent: genius
    next: stub
    conditions:
      - on_result: approved
        next: stub
      - on_result: rejected
        next: ctx_architect
      - on_result: default
        next: stub

  - name: stub
    agent: dev
    skill: [stub-only]
    next: stub_review

  - name: stub_review
    agent: review
    next: stub_approval
    conditions:
      - on_result: approved
        next: stub_approval
      - on_result: rejected
        next: stub
      - on_result: default
        next: stub_approval

  - name: stub_approval
    agent: genius
    human_gate: true
    conditions:
      - on_result: approved
        next: implement
      - on_result: rejected
        next: stub
      - on_result: default
        next: implement
    next: implement

  - name: implement
    agent: dev
    next: review
  
  - name: review
    agent: review
    next: null
    conditions:
      - on_result: approved
        next: null
      - on_result: rejected
        next: implement
      - on_result: default
        next: null
