[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebuko"
version = "0.0.0"
description = "Nebuko — multi-agent GitHub workflow engine (formerly git-flow-ai)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "rich>=13",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
# The agent runtime is installed by CI / the dev shell; kept optional so the
# library (engine + adapters) can be imported without pulling the SDK.
# Pinned to a commit SHA, not `main` (issue #982): upstream moves several
# commits a day, and an unpinned install makes any run's behavior
# unreproducible. Bump the SHA in one place — here, and in the mirror in
# `.nebuko-engine/pyproject.toml` — then re-resolve `uv lock`. The CI workflow
# syncs whatever `uv.lock` records; it has no separate install pin.
# `.github/workflows/nebuko-workflow.yaml`, and `uv.lock` (re-resolve with
# `uv lock`).
runtime = [
    "litellm",
    # The official Claude Code SDK (issue #1368): it drives the plain `claude`
    # binary in headless mode and can host an *in-process* MCP server, which is
    # the only way a custom tool (``finalize``) reaches Claude Code.
    "claude-agent-sdk>=0.1",
    "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@8ba966d1d3af49f08e04349c055009e1614b48d6#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@8ba966d1d3af49f08e04349c055009e1614b48d6#subdirectory=openhands-tools",
]

[project.scripts]
nebuko = "nebuko.engine.run_loop:main"

# PyInstaller discovers these hooks when building the release binary
# (packaging/entry.py): litellm's model-cost JSON must be bundled or every
# command that imports the SDK crashes (issue #1113).
[project.entry-points.pyinstaller40]
hook-dirs = "nebuko.engine._pyinstaller_hooks:hook_dirs"

[dependency-groups]
# Test tooling. `dev` is a default uv group, so `uv sync` / `uv run` provision
# pytest + pytest-mock automatically — agents and humans must not install them
# ad hoc (issue #851).
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-xdist>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The packaged init artifacts (manifest + caller workflow) live in
# nebuko.engine.init.defaults. The caller workflow ships here because no tag
# before PR 1 (issue #1272) contains it; the first release tag cut after PR 1
# merges is a precondition for PR 2's Worker, which fetches both files at the
# resolved release tag.
"nebuko.engine.init" = ["templates/*.yaml.j2"]
"nebuko.engine.init.defaults" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/nebuko/engine/lib"]
# `slow` tests each spawn a fresh interpreter that imports the agent SDK (~10s).
# The fast run skips them: `uv run pytest -n 4 -m "not slow"`. CI runs everything.
markers = [
    "slow: spawns a fresh interpreter that imports the agent SDK (~10s each); skipped by the fast run",
]

[tool.mypy]
# The engine library is a real subpackage (issue #1165): type checkers resolve
# ``nebuko.engine.lib.*`` from the packaged tree with no path configuration.
files = ["src"]
