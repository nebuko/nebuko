[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebuko"
version = "0.0.0"
description = "Nebuko — multi-agent GitHub workflow engine (formerly git-flow-ai)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "rich>=13",
]

[project.optional-dependencies]
# The agent runtime is installed by CI / the dev shell; kept optional so the
# library (engine + adapters) can be imported without pulling the SDK.
runtime = [
    "litellm",
    "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@main#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@main#subdirectory=openhands-tools",
]

[project.scripts]
nebuko = "nebuko.engine.run_loop:main"

[dependency-groups]
# Test tooling. `dev` is a default uv group, so `uv sync` / `uv run` provision
# pytest + pytest-mock automatically — agents and humans must not install them
# ad hoc (issue #851).
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The caller workflow is the one packaged artifact: no existing tag contains it,
# so it cannot be fetched at the pinned ref like the provider templates.
"nebuko.engine.init" = ["templates/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "src/nebuko/engine/lib"]
testpaths = ["tests"]
