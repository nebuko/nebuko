<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nebuko — under maintenance</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1b1436 0%, #0b0a1a 55%, #06060f 100%);
    color: #e8e6f5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .card { max-width: 34rem; }
  .logo { width: min(320px, 70vw); height: auto; }
  .orb {
    width: 10px; height: 10px; margin: 2.5rem auto 1.5rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #5A3DF0, #2F9BFF);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.6); opacity: 1; }
  }
  h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); font-weight: 700; }
  p { margin-top: 1rem; color: #a9a4c9; font-size: clamp(1rem, 3.5vw, 1.125rem); line-height: 1.6; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.svg" alt="Nebuko">
    <div class="orb" aria-hidden="true"></div>
    <h1>We&rsquo;re crafting something great</h1>
    <p>Nebuko is temporarily under maintenance while we put the finishing touches in place. We&rsquo;ll be back shortly &mdash; thanks for your patience.</p>
  </main>
</body>
</html>
